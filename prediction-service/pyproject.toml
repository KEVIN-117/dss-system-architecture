[project]
name = "prediction-service"
version = "0.1.0"
description = "FastAPI service for academic prediction capabilities"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "celery>=5.5",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.7",
    "xgboost>=3.0",
    "imbalanced-learn>=0.13",
    "pandas>=2.3",
    "numpy>=2.3",
    "joblib>=1.5",
]
worker = [
    "prediction-service[ml]",
    "celery>=5.5",
]
test = [
    "prediction-service[ml]",
    "pytest>=8.0",
]
