name: dss-dw-schema-test

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dw_schema_test
      POSTGRES_USER: dw_test
      POSTGRES_PASSWORD: dw_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw_test -d dw_schema_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  dw-schema-test:
    image: postgres:15-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: dw_schema_test
      PGUSER: dw_test
      PGPASSWORD: dw_test
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts:/scripts:ro
      - ./tests:/tests:ro
    command:
      - /bin/sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 -f /migrations/0001_create_academic_closure_calendar.sql
        psql -v ON_ERROR_STOP=1 -f /tests/academic_closure_calendar_test.sql
        psql -v ON_ERROR_STOP=1 -f /tests/dw_002_upgrade_fixture.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/0002_create_analytical_layers_and_roles.sql
        psql -v ON_ERROR_STOP=1 -f /tests/dw_004_upgrade_fixture.sql
        psql -v ON_ERROR_STOP=1 -c "CREATE EXTENSION pgcrypto WITH SCHEMA public"
        tr -d '\r' < /scripts/apply-migrations.sh | /bin/sh
        psql -v ON_ERROR_STOP=1 -f /tests/dw_003_upgrade_assertion.sql
        psql -v ON_ERROR_STOP=1 -f /tests/dw_004_upgrade_assertion.sql
        tr -d '\r' < /scripts/apply-migrations.sh | /bin/sh
        tr -d '\r' < /tests/dimension_migration_immutability_test.sh | sh
        psql -v ON_ERROR_STOP=1 -f /tests/analytical_layers_and_roles_test.sql
        psql -v ON_ERROR_STOP=1 -f /tests/execution_control_test.sql
        psql -v ON_ERROR_STOP=1 -f /tests/conformed_dimensions_test.sql
        psql -v ON_ERROR_STOP=1 -f /tests/hop_execution_gates_test.sql
        psql -v ON_ERROR_STOP=1 -f /tests/hop_atomic_publisher_test.sql
        psql -v ON_ERROR_STOP=1 -f /tests/hop_atomic_publisher_rollback_test.sql
        tr -d '\r' < /tests/execution_lock_concurrency_test.sh | sh
    restart: "no"
