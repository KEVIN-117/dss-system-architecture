name: dss-dw-integration-test

services:
  jachasun-fixture:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:${DW_INTEGRATION_SOURCE_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: jachasun_test
      POSTGRES_USER: source_test
      POSTGRES_PASSWORD: source_test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../dw-test-data/source:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_test -d jachasun_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  postgres-dw:
    image: postgres:15-alpine
    command: ["postgres", "-c", "max_connections=100"]
    ports:
      - "127.0.0.1:${DW_INTEGRATION_TARGET_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: dw_integration
      POSTGRES_USER: dw_test
      POSTGRES_PASSWORD: dw_test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw_test -d dw_integration"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  auth-catalog-fixture:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: auth_catalog_test
      POSTGRES_USER: auth_test_admin
      POSTGRES_PASSWORD: auth_test_admin
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../auth-service/src/main/resources/db/migration/V1__init_schema.sql:/docker-entrypoint-initdb.d/010-V1__init_schema.sql:ro
      - ../../auth-service/src/main/resources/db/migration/V2__init_schema.sql:/docker-entrypoint-initdb.d/020-V2__init_schema.sql:ro
      - ../../auth-service/src/main/resources/db/migration/V3__create_academic_catalog.sql:/docker-entrypoint-initdb.d/030-V3__create_academic_catalog.sql:ro
      - ./init/040-create-hop-catalog-fixture-writer.sql:/docker-entrypoint-initdb.d/040-create-hop-catalog-fixture-writer.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_test_admin -d auth_catalog_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: "no"

  integration-test:
    image: postgres:15-alpine
    depends_on:
      jachasun-fixture:
        condition: service_healthy
      postgres-dw:
        condition: service_healthy
    environment:
      PGHOST: postgres-dw
      PGPORT: "5432"
      PGDATABASE: dw_integration
      PGUSER: dw_test
      PGPASSWORD: dw_test
      SOURCE_HOST: jachasun-fixture
      SOURCE_PORT: "5432"
      SOURCE_DB: jachasun_test
      SOURCE_USER: dw_fixture_reader
      SOURCE_PASSWORD: fixture_readonly
      TARGET_HOST: postgres-dw
      TARGET_PORT: "5432"
      TARGET_DB: dw_integration
      TARGET_USER: dw_test
      TARGET_PASSWORD: dw_test
    volumes:
      - ../dw-test-data:/fixtures:ro
      - ../dw-schema/migrations:/migrations:ro
      - ../dw-schema/scripts:/scripts:ro
      - ./tests/run_integration_tests.sh:/tests/run_integration_tests.sh:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "tr -d '\\r' < /scripts/apply-migrations.sh | /bin/sh && tr -d '\\r' < /scripts/apply-migrations.sh | /bin/sh && tr -d '\\r' < /tests/run_integration_tests.sh | /bin/sh",
      ]
    restart: "no"

  migration-only:
    image: postgres:15-alpine
    depends_on:
      postgres-dw:
        condition: service_healthy
    environment:
      PGHOST: postgres-dw
      PGPORT: "5432"
      PGDATABASE: dw_integration
      PGUSER: dw_test
      PGPASSWORD: dw_test
    volumes:
      - ../dw-schema/migrations:/migrations:ro
      - ../dw-schema/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\r' < /scripts/apply-migrations.sh | /bin/sh"]
    restart: "no"

  upgrade-test:
    image: postgres:15-alpine
    depends_on:
      postgres-dw:
        condition: service_healthy
    environment:
      PGHOST: postgres-dw
      PGPORT: "5432"
      PGDATABASE: dw_integration
      PGUSER: dw_test
      PGPASSWORD: dw_test
    volumes:
      - ../dw-schema/migrations:/migrations:ro
      - ../dw-schema/scripts:/scripts:ro
      - ./tests/test_dw011_upgrade.sh:/tests/test_dw011_upgrade.sh:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\r' < /tests/test_dw011_upgrade.sh | /bin/sh"]
    restart: "no"

  loadmanager-integration-test:
    image: golang:1.26.5
    depends_on:
      integration-test:
        condition: service_completed_successfully
    working_dir: /workspace/etl-layer/loadmanager
    environment:
      SOURCE_HOST: jachasun-fixture
      SOURCE_DB: jachasun_test
      SOURCE_USER: dw_fixture_reader
      SOURCE_PASSWORD: fixture_readonly
      TARGET_HOST: postgres-dw
      TARGET_DB: dw_integration
      TARGET_USER: loadmanager_test
      TARGET_PASSWORD: loadmanager_test
      LOADMANAGER_QUERY_DIR: /workspace/infra/postgres-tx/extract
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod-cache
    volumes:
      - ../..:/workspace:ro
    command: ["go", "test", "-tags=integration", "./..."]
    restart: "no"

  hop-vertical-integration-test:
    image: apache/hop:2.19.0
    profiles: ["dw-vertical"]
    depends_on:
      integration-test:
        condition: service_completed_successfully
    volumes:
      - ../../etl-layer/apache-hop/projects/dss-uatf-etl:/files/project:ro
      - ../../etl-layer/apache-hop/jdbc:/files/jdbc:ro
    environment:
      HOP_PROJECT_NAME: dss-uatf-etl
      HOP_PROJECT_FOLDER: /files/project
      HOP_PROJECT_CONFIG_FILE_NAME: project-config.json
      HOP_ENVIRONMENT_NAME: integration-test
      HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS: /files/project/environments/integration-test.example.json
      HOP_SHARED_JDBC_FOLDERS: /files/jdbc
      HOP_FILE_PATH: /files/project/workflows/wf_vertical_uatf_datos_smoke.hwf
      HOP_RUN_CONFIG: local
      HOP_RUN_PARAMETERS: P_RUN_ID=a1300000-0000-0000-0000-000000000001,P_REQUESTED_GESTION=2025,P_REQUESTED_PERIODO=2
      HOP_OPTIONS: >-
        -DDB_DW_HOST=postgres-dw
        -DDB_DW_PORT=5432
        -DDB_DW_NAME=dw_integration
        -DDB_TX_HOST=jachasun-fixture
        -DDB_TX_PORT=5432
        -DDB_TX_NAME=jachasun_test
    restart: "no"

  hop-catalog-initial-test:
    image: apache/hop:2.19.0
    profiles: ["academic-catalog-sync"]
    depends_on:
      auth-catalog-fixture:
        condition: service_healthy
    volumes:
      - ../../etl-layer/apache-hop/projects/dss-uatf-etl:/files/project:ro
      - ../../etl-layer/apache-hop/jdbc:/files/jdbc:ro
    environment:
      HOP_PROJECT_NAME: dss-uatf-etl
      HOP_PROJECT_FOLDER: /files/project
      HOP_PROJECT_CONFIG_FILE_NAME: project-config.json
      HOP_ENVIRONMENT_NAME: integration-test
      HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS: /files/project/environments/integration-test.example.json
      HOP_SHARED_JDBC_FOLDERS: /files/jdbc
      HOP_FILE_PATH: /files/project/workflows/wf_sync_academic_catalog.hwf
      HOP_RUN_CONFIG: local
      HOP_OPTIONS: >-
        -DDB_DW_HOST=postgres-dw
        -DDB_DW_PORT=5432
        -DDB_DW_NAME=dw_integration
        -DDB_TX_HOST=jachasun-fixture
        -DDB_TX_PORT=5432
        -DDB_TX_NAME=jachasun_test
    restart: "no"

  hop-catalog-initial-assert:
    image: postgres:15-alpine
    profiles: ["academic-catalog-sync"]
    depends_on:
      auth-catalog-fixture:
        condition: service_healthy
    environment:
      PGHOST: auth-catalog-fixture
      PGPORT: "5432"
      PGDATABASE: auth_catalog_test
      PGUSER: auth_test_admin
      PGPASSWORD: auth_test_admin
    volumes:
      - ./tests/assert_hop_academic_catalog.sql:/tests/assert_hop_academic_catalog.sql:ro
    entrypoint: ["/bin/sh", "-c", "psql -X -v ON_ERROR_STOP=1 -f /tests/assert_hop_academic_catalog.sql"]
    restart: "no"

  hop-catalog-replay-test:
    image: apache/hop:2.19.0
    profiles: ["academic-catalog-sync"]
    depends_on:
      auth-catalog-fixture:
        condition: service_healthy
    volumes:
      - ../../etl-layer/apache-hop/projects/dss-uatf-etl:/files/project:ro
      - ../../etl-layer/apache-hop/jdbc:/files/jdbc:ro
    environment:
      HOP_PROJECT_NAME: dss-uatf-etl
      HOP_PROJECT_FOLDER: /files/project
      HOP_PROJECT_CONFIG_FILE_NAME: project-config.json
      HOP_ENVIRONMENT_NAME: integration-test
      HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS: /files/project/environments/integration-test.example.json
      HOP_SHARED_JDBC_FOLDERS: /files/jdbc
      HOP_FILE_PATH: /files/project/workflows/wf_sync_academic_catalog.hwf
      HOP_RUN_CONFIG: local
      HOP_OPTIONS: >-
        -DDB_DW_HOST=postgres-dw
        -DDB_DW_PORT=5432
        -DDB_DW_NAME=dw_integration
        -DDB_TX_HOST=jachasun-fixture
        -DDB_TX_PORT=5432
        -DDB_TX_NAME=jachasun_test
    restart: "no"

  hop-catalog-replay-assert:
    image: postgres:15-alpine
    profiles: ["academic-catalog-sync"]
    depends_on:
      auth-catalog-fixture:
        condition: service_healthy
    environment:
      PGHOST: auth-catalog-fixture
      PGPORT: "5432"
      PGDATABASE: auth_catalog_test
      PGUSER: auth_test_admin
      PGPASSWORD: auth_test_admin
    volumes:
      - ./tests/assert_hop_academic_catalog.sql:/tests/assert_hop_academic_catalog.sql:ro
    entrypoint: ["/bin/sh", "-c", "psql -X -v ON_ERROR_STOP=1 -f /tests/assert_hop_academic_catalog.sql"]
    restart: "no"

  hop-source-query-contract-test:
    image: postgres:15-alpine
    profiles: ["dw-req6-sources"]
    depends_on:
      jachasun-fixture:
        condition: service_healthy
    environment:
      PGHOST: jachasun-fixture
      PGPORT: "5432"
      PGDATABASE: jachasun_test
      PGUSER: dw_fixture_reader
      PGPASSWORD: fixture_readonly
    volumes:
      - ../../etl-layer/apache-hop/projects/dss-uatf-etl/pipelines/source/sql:/queries:ro
      - ./tests/test_hop_source_queries.sh:/tests/test_hop_source_queries.sh:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\r' < /tests/test_hop_source_queries.sh | /bin/sh"]
    restart: "no"

  hop-vertical-assert:
    image: postgres:15-alpine
    profiles: ["dw-vertical"]
    depends_on:
      hop-vertical-integration-test:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres-dw
      PGPORT: "5432"
      PGDATABASE: dw_integration
      PGUSER: dw_test
      PGPASSWORD: dw_test
    volumes:
      - ./tests/assert_hop_vertical.sql:/tests/assert_hop_vertical.sql:ro
    entrypoint: ["/bin/sh", "-c", "psql -X -v ON_ERROR_STOP=1 -f /tests/assert_hop_vertical.sql"]
    restart: "no"

  hop-publish-fixture:
    image: postgres:15-alpine
    profiles: ["dw-publish"]
    depends_on:
      integration-test:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres-dw
      PGPORT: "5432"
      PGDATABASE: dw_integration
      PGUSER: dw_test
      PGPASSWORD: dw_test
    volumes:
      - ./tests/prepare_hop_publish.sql:/tests/prepare_hop_publish.sql:ro
    entrypoint: ["/bin/sh", "-c", "psql -X -v ON_ERROR_STOP=1 -f /tests/prepare_hop_publish.sql"]
    restart: "no"

  hop-publish-integration-test:
    image: apache/hop:2.19.0
    profiles: ["dw-publish"]
    depends_on:
      hop-publish-fixture:
        condition: service_completed_successfully
    volumes:
      - ../../etl-layer/apache-hop/projects/dss-uatf-etl:/files/project:ro
      - ../../etl-layer/apache-hop/jdbc:/files/jdbc:ro
    environment:
      HOP_PROJECT_NAME: dss-uatf-etl
      HOP_PROJECT_FOLDER: /files/project
      HOP_PROJECT_CONFIG_FILE_NAME: project-config.json
      HOP_ENVIRONMENT_NAME: integration-test
      HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS: /files/project/environments/integration-test.example.json
      HOP_SHARED_JDBC_FOLDERS: /files/jdbc
      HOP_FILE_PATH: /files/project/workflows/wf_hop_publish_staged_run.hwf
      HOP_RUN_CONFIG: local
      HOP_RUN_PARAMETERS: P_RUN_ID=b1300000-0000-0000-0000-000000000001
      HOP_OPTIONS: >-
        -DDB_DW_HOST=postgres-dw
        -DDB_DW_PORT=5432
        -DDB_DW_NAME=dw_integration
        -DDB_TX_HOST=jachasun-fixture
        -DDB_TX_PORT=5432
        -DDB_TX_NAME=jachasun_test
    restart: "no"

  hop-publish-assert:
    image: postgres:15-alpine
    profiles: ["dw-publish"]
    depends_on:
      hop-publish-integration-test:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres-dw
      PGPORT: "5432"
      PGDATABASE: dw_integration
      PGUSER: dw_test
      PGPASSWORD: dw_test
    volumes:
      - ./tests/assert_hop_publish.sql:/tests/assert_hop_publish.sql:ro
    entrypoint: ["/bin/sh", "-c", "psql -X -v ON_ERROR_STOP=1 -f /tests/assert_hop_publish.sql"]
    restart: "no"
