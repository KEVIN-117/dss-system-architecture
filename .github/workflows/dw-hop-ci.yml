name: DW and Apache Hop CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dw-hop-ci.yml"
      - ".github/workflows/container-release.yml"
      - ".github/release-please-config.json"
      - ".release-please-manifest.json"
      - ".env.example"
      - "docker-compose.yml"
      - "docs/dw/**"
      - "etl-layer/apache-hop/**"
      - "infra/dw-schema/**"
      - "infra/dw-control-db-provision/**"
      - "infra/dw-integration/**"
      - "infra/dw-test-data/**"
      - "auth-service/src/main/resources/db/migration/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Hop project and Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Apache Hop project
        run: python etl-layer/apache-hop/scripts/validate_project.py

      - name: Validate Release Please JSON configuration
        run: |
          python -m json.tool .github/release-please-config.json > /dev/null
          python -m json.tool .release-please-manifest.json > /dev/null

      - name: Cache pinned PostgreSQL JDBC driver
        uses: actions/cache@v4
        with:
          path: etl-layer/apache-hop/jdbc/postgresql-42.7.11.jar
          key: postgres-jdbc-42.7.11-${{ hashFiles('etl-layer/apache-hop/scripts/download-postgres-jdbc.sh') }}

      - name: Download pinned PostgreSQL JDBC driver
        run: |
          bash etl-layer/apache-hop/scripts/download-postgres-jdbc.sh

      - name: Build Apache Hop Web image
        run: docker build --tag dss-apache-hop:${{ github.sha }} etl-layer/apache-hop

      - name: Build Apache Hop Server image
        run: docker build --file etl-layer/apache-hop/Dockerfile.server --tag dss-apache-hop-server:${{ github.sha }} etl-layer/apache-hop

      - name: Build DW migrator image
        run: >-
          docker build
          --build-arg MIGRATIONS_VERSION=ci-${{ github.sha }}
          --tag dss-dw-migrator:${{ github.sha }}
          infra/dw-schema

      - name: Verify packaged DW migrations
        env:
          IMAGE: dss-dw-migrator:${{ github.sha }}
        shell: bash
        run: |
          expected=$(find infra/dw-schema/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' | wc -l)
          actual=$(docker run --rm --entrypoint sh "$IMAGE" -ec \
            "test -x /usr/local/bin/apply-migrations.sh; find /migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' | wc -l")
          test "$actual" -eq "$expected"
          echo "Verified $actual packaged SQL migrations."

      - name: Build and verify DW Control DB Provision image
        run: |
          docker build \
            --build-arg PROVISION_VERSION=ci-${{ github.sha }} \
            --tag dss-dw-control-db-provision:${{ github.sha }} \
            infra/dw-control-db-provision
          docker run --rm --entrypoint sh dss-dw-control-db-provision:${{ github.sha }} -ec \
            "test -x /usr/local/bin/provision-runtime.sh && test -f /scripts/provision-local-dw-control-runtime.sql"
          echo "Verified packaged DW Control DB Provision image."

      - name: Verify packaged Hop project and runtime files
        run: |
          docker run --rm --entrypoint /bin/bash dss-apache-hop:${{ github.sha }} -ec '
            test -f /files/project/project-config.json &&
            test -f /files/project/workflows/wf_vertical_uatf_datos_smoke.hwf &&
            test -f /files/scripts/start-hop-web.sh &&
            test -f /usr/local/tomcat/jdbc-drivers/postgresql-42.7.11.jar &&
            test ! -f /files/project/environments/prod-env.json &&
            test ! -f /files/project/environments/dev-env.json
          '
          docker run --rm --entrypoint /bin/bash dss-apache-hop-server:${{ github.sha }} -ec '
            test -f /files/project/project-config.json &&
            test -f /files/project/workflows/wf_vertical_uatf_datos_smoke.hwf &&
            test -f /files/project/workflows/wf_sync_academic_catalog.hwf &&
            test -f /files/project/workflows/wf_hop_publish_staged_run.hwf &&
            test -x /files/scripts/start-hop-server.sh &&
            test -f /files/jdbc-drivers/postgresql-42.7.11.jar &&
            test ! -f /files/project/environments/prod-env.json &&
            test ! -f /files/project/environments/dev-env.json
          '
          # The server must refuse the upstream default credentials.
          if docker run --rm \
              -e HOP_ENVIRONMENT_NAME=integration-test \
              -e HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS=/files/project/environments/integration-test.example.json \
              -e HOP_SERVER_USER=cluster -e HOP_SERVER_PASS=cluster \
              dss-apache-hop-server:${{ github.sha }}; then
            echo "Hop Server started with cluster/cluster credentials" >&2
            exit 1
          fi

      - name: Validate Compose configuration
        env:
          # Compose requires this value while rendering the full stack. It is
          # a disposable placeholder; CI does not start services or connect to
          # any database.
          KEYCLOAK_BFF_CLIENT_SECRET: ci-placeholder
          KEYCLOAK_OLAP_CLIENT_SECRET: ci-placeholder
          KEYCLOAK_AUTH_SERVICE_CLIENT_SECRET: ci-placeholder
          DW_CONTROL_DB_PASSWORD: ci-placeholder
          BFF_SESSION_SECRET: ci-placeholder-session-secret-32-characters
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose -f infra/dw-schema/dw-test-docker.yml config --quiet
          docker compose -f infra/dw-integration/dw-integration-test.yml config --quiet
          docker compose -f infra/dw-test-data/historical-v2/compose.yml config --quiet

      - name: Run PostgreSQL DW regression suite
        run: docker compose -f infra/dw-schema/dw-test-docker.yml up --build --exit-code-from dw-schema-test

      - name: Run Hop source-query contract regression
        run: docker compose -p dss-dw-source-contract -f infra/dw-integration/dw-integration-test.yml --profile dw-req6-sources run --rm hop-source-query-contract-test

      - name: Stop source-query fixtures before next suite
        if: always()
        run: docker compose -p dss-dw-source-contract -f infra/dw-integration/dw-integration-test.yml down --volumes --remove-orphans

      - name: Run Hop Server contract regression
        run: |
          docker compose -p dss-dw-hop-server -f infra/dw-integration/dw-integration-test.yml --profile hop-server up -d --build --wait jachasun-fixture auth-catalog-fixture hop-server
          docker compose -p dss-dw-hop-server -f infra/dw-integration/dw-integration-test.yml --profile hop-server run --rm --no-deps hop-server-catalog-test
          docker compose -p dss-dw-hop-server -f infra/dw-integration/dw-integration-test.yml --profile hop-server run --rm --no-deps hop-server-catalog-assert

      - name: Show Hop Server logs on failure
        if: failure()
        run: docker compose -p dss-dw-hop-server -f infra/dw-integration/dw-integration-test.yml --profile hop-server logs --no-color hop-server auth-catalog-fixture

      - name: Stop Hop Server fixtures before next suite
        if: always()
        run: docker compose -p dss-dw-hop-server -f infra/dw-integration/dw-integration-test.yml --profile hop-server down --volumes --remove-orphans

      - name: Run Hop vertical workflow regression
        run: docker compose -p dss-dw-vertical -f infra/dw-integration/dw-integration-test.yml --profile dw-vertical run --rm hop-vertical-assert

      - name: Show Hop vertical logs on failure
        if: failure()
        run: docker compose -p dss-dw-vertical -f infra/dw-integration/dw-integration-test.yml --profile dw-vertical logs --no-color integration-test hop-vertical-integration-test

      - name: Stop vertical workflow fixtures before next suite
        if: always()
        run: docker compose -p dss-dw-vertical -f infra/dw-integration/dw-integration-test.yml down --volumes --remove-orphans

      - name: Run Hop atomic publication regression
        run: docker compose -p dss-dw-publish -f infra/dw-integration/dw-integration-test.yml --profile dw-publish run --rm hop-publish-assert

      - name: Show Hop publication logs on failure
        if: failure()
        run: docker compose -p dss-dw-publish -f infra/dw-integration/dw-integration-test.yml logs --no-color hop-publish-fixture hop-publish-integration-test

      - name: Stop Hop regression containers
        if: always()
        run: |
          for project in dss-dw-source-contract dss-dw-hop-server dss-dw-vertical dss-dw-publish; do
            docker compose -p "$project" -f infra/dw-integration/dw-integration-test.yml down --volumes --remove-orphans
          done

      - name: Stop test containers
        if: always()
        run: docker compose -f infra/dw-schema/dw-test-docker.yml down --volumes
