name: DW and Apache Hop CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dw-hop-ci.yml"
      - ".github/workflows/container-release.yml"
      - ".github/release-please-config.json"
      - ".release-please-manifest.json"
      - ".env.example"
      - "docker-compose.yml"
      - "docs/dw/**"
      - "etl-layer/apache-hop/**"
      - "infra/dw-schema/**"
      - "infra/dw-integration/**"
      - "infra/dw-test-data/**"
      - "auth-service/src/main/resources/db/migration/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Hop project and Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Apache Hop project
        run: python etl-layer/apache-hop/scripts/validate_project.py

      - name: Validate Release Please JSON configuration
        run: |
          python -m json.tool .github/release-please-config.json > /dev/null
          python -m json.tool .release-please-manifest.json > /dev/null

      - name: Download pinned PostgreSQL JDBC driver
        run: |
          mkdir -p etl-layer/apache-hop/jdbc
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/org/postgresql/postgresql/42.7.11/postgresql-42.7.11.jar \
            --output etl-layer/apache-hop/jdbc/postgresql-42.7.11.jar
          echo '1981B31D3993C58702783C1CDDF10A34E48C1F413D70FF1CB6DEF0A143484647  etl-layer/apache-hop/jdbc/postgresql-42.7.11.jar' | sha256sum --check --status

      - name: Build Apache Hop Web image
        run: docker build --tag dss-apache-hop:${{ github.sha }} etl-layer/apache-hop

      - name: Verify packaged Hop project and runtime files
        run: |
          docker run --rm --entrypoint /bin/bash dss-apache-hop:${{ github.sha }} -ec '
            test -f /files/project/project-config.json &&
            test -f /files/project/workflows/wf_vertical_uatf_datos_smoke.hwf &&
            test -f /files/scripts/start-hop-web.sh &&
            test -f /files/postgresql-42.7.11.jar &&
            test ! -f /files/project/environments/prod-env.json &&
            test ! -f /files/project/environments/dev-env.json
          '

      - name: Validate Compose configuration
        env:
          # Compose requires this value while rendering the full stack. It is
          # a disposable placeholder; CI does not start services or connect to
          # any database.
          KEYCLOAK_BFF_CLIENT_SECRET: ci-placeholder
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose -f infra/dw-schema/dw-test-docker.yml config --quiet
          docker compose -f infra/dw-integration/dw-integration-test.yml config --quiet
          docker compose -f infra/dw-test-data/historical-v2/compose.yml config --quiet

      - name: Run PostgreSQL DW regression suite
        run: docker compose -f infra/dw-schema/dw-test-docker.yml up --build --exit-code-from dw-schema-test

      - name: Run Apache Hop academic catalog sync regression
        run: |
          compose=(docker compose -p dss-dw-catalog-sync -f infra/dw-integration/dw-integration-test.yml)
          "${compose[@]}" up -d jachasun-fixture auth-catalog-fixture
          "${compose[@]}" --profile academic-catalog-sync run --rm --no-deps hop-catalog-initial-test
          "${compose[@]}" --profile academic-catalog-sync run --rm --no-deps hop-catalog-initial-assert
          "${compose[@]}" --profile academic-catalog-sync run --rm --no-deps hop-catalog-replay-test
          "${compose[@]}" --profile academic-catalog-sync run --rm --no-deps hop-catalog-replay-assert

      - name: Stop academic catalog fixtures before other suites
        if: always()
        run: docker compose -p dss-dw-catalog-sync -f infra/dw-integration/dw-integration-test.yml down --volumes --remove-orphans

      - name: Run Hop source-query contract regression
        run: docker compose -p dss-dw-source-contract -f infra/dw-integration/dw-integration-test.yml --profile dw-req6-sources run --rm hop-source-query-contract-test

      - name: Stop source-query fixtures before next suite
        if: always()
        run: docker compose -p dss-dw-source-contract -f infra/dw-integration/dw-integration-test.yml down --volumes --remove-orphans

      - name: Run Hop vertical workflow regression
        run: docker compose -p dss-dw-vertical -f infra/dw-integration/dw-integration-test.yml --profile dw-vertical run --rm hop-vertical-assert

      - name: Stop vertical workflow fixtures before next suite
        if: always()
        run: docker compose -p dss-dw-vertical -f infra/dw-integration/dw-integration-test.yml down --volumes --remove-orphans

      - name: Run Hop atomic publication regression
        run: docker compose -p dss-dw-publish -f infra/dw-integration/dw-integration-test.yml --profile dw-publish run --rm hop-publish-assert

      - name: Stop academic catalog test containers
        if: always()
        run: docker compose -p dss-dw-catalog-sync -f infra/dw-integration/dw-integration-test.yml down --volumes --remove-orphans

      - name: Stop Hop regression containers
        if: always()
        run: |
          for project in dss-dw-source-contract dss-dw-vertical dss-dw-publish; do
            docker compose -p "$project" -f infra/dw-integration/dw-integration-test.yml down --volumes --remove-orphans
          done

      - name: Stop test containers
        if: always()
        run: docker compose -f infra/dw-schema/dw-test-docker.yml down --volumes
