name: Publish one DSS Next.js application

on:
  workflow_call:
    inputs:
      app_name:
        description: Folder and Nx project suffix of the application
        required: true
        type: string
      image_name:
        description: Docker Hub repository name without its namespace
        required: true
        type: string
      version:
        required: true
        type: string
      major:
        required: true
        type: string
      minor:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public build configuration
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
          NEXT_PUBLIC_BFF_URL: ${{ vars.NEXT_PUBLIC_BFF_URL }}
          NEXT_PUBLIC_ADMIN_PORTAL_URL: ${{ vars.NEXT_PUBLIC_ADMIN_PORTAL_URL }}
          NEXT_PUBLIC_RECTOR_DASHBOARD_URL: ${{ vars.NEXT_PUBLIC_RECTOR_DASHBOARD_URL }}
          NEXT_PUBLIC_DECANO_DASHBOARD_URL: ${{ vars.NEXT_PUBLIC_DECANO_DASHBOARD_URL }}
          NEXT_PUBLIC_DIRECTOR_DASHBOARD_URL: ${{ vars.NEXT_PUBLIC_DIRECTOR_DASHBOARD_URL }}
          NEXT_PUBLIC_OLAP_WORKSPACE_URL: ${{ vars.NEXT_PUBLIC_OLAP_WORKSPACE_URL }}
        run: |
          require_url() {
            local name="$1"
            local value="$2"
            if [[ ! "$value" =~ ^https?://[^/]+ ]]; then
              echo "Repository variable ${name} must be set to an absolute HTTP(S) URL before publishing this app." >&2
              exit 1
            fi
          }

          case "$APP_NAME" in
            admin-portal|director-dashboard|decano-dashboard|rector-dashboard|olap-workspace)
              require_url NEXT_PUBLIC_BFF_URL "$NEXT_PUBLIC_BFF_URL"
              ;;
            landing)
              require_url NEXT_PUBLIC_BFF_URL "$NEXT_PUBLIC_BFF_URL"
              require_url NEXT_PUBLIC_ADMIN_PORTAL_URL "$NEXT_PUBLIC_ADMIN_PORTAL_URL"
              require_url NEXT_PUBLIC_RECTOR_DASHBOARD_URL "$NEXT_PUBLIC_RECTOR_DASHBOARD_URL"
              require_url NEXT_PUBLIC_DECANO_DASHBOARD_URL "$NEXT_PUBLIC_DECANO_DASHBOARD_URL"
              require_url NEXT_PUBLIC_DIRECTOR_DASHBOARD_URL "$NEXT_PUBLIC_DIRECTOR_DASHBOARD_URL"
              ;;
            bff|docs-portal)
              ;;
            *)
              echo "Unsupported DSS monorepo app: ${APP_NAME}" >&2
              exit 1
              ;;
          esac

          case "$APP_NAME" in
            director-dashboard|decano-dashboard|rector-dashboard)
              require_url NEXT_PUBLIC_OLAP_WORKSPACE_URL "$NEXT_PUBLIC_OLAP_WORKSPACE_URL"
              ;;
          esac

      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=${{ inputs.major }}
            type=raw,value=${{ inputs.major }}.${{ inputs.minor }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: dss-monorepo
          file: dss-monorepo/Dockerfile
          build-args: |
            APP_NAME=${{ inputs.app_name }}
            NEXT_PUBLIC_BFF_URL=${{ vars.NEXT_PUBLIC_BFF_URL }}
            NEXT_PUBLIC_ADMIN_PORTAL_URL=${{ vars.NEXT_PUBLIC_ADMIN_PORTAL_URL }}
            NEXT_PUBLIC_RECTOR_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_RECTOR_DASHBOARD_URL }}
            NEXT_PUBLIC_DECANO_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_DECANO_DASHBOARD_URL }}
            NEXT_PUBLIC_DIRECTOR_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_DIRECTOR_DASHBOARD_URL }}
            NEXT_PUBLIC_OLAP_WORKSPACE_URL=${{ vars.NEXT_PUBLIC_OLAP_WORKSPACE_URL }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dss-${{ inputs.app_name }}
          cache-to: type=gha,mode=max,scope=dss-${{ inputs.app_name }}
          sbom: true
          provenance: mode=max
