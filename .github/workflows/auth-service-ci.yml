name: Auth Service CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/auth-service-ci.yml"
      - ".env.example"
      - "docker-compose.yml"
      - "auth-service/**"
      - "infra/keycloak/realm/**"
      - "infra/rabbitmq/**"
      - "keycloak-webhook/pom.xml"
      - "keycloak-webhook/src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, checks, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: auth-service/pom.xml

      - name: Validate Compose configuration
        env:
          # Required only to render Compose; no service is started in this step.
          KEYCLOAK_BFF_CLIENT_SECRET: ci-placeholder
          KEYCLOAK_OLAP_CLIENT_SECRET: ci-placeholder
          DW_CONTROL_DB_PASSWORD: ci-placeholder
        run: docker compose --env-file .env.example config --quiet

      - name: Build auth-service
        working-directory: auth-service
        run: bash ./mvnw --batch-mode --no-transfer-progress -DskipTests clean package

      - name: Run architecture checks
        working-directory: auth-service
        run: bash ./mvnw --batch-mode --no-transfer-progress -Dtest=ArchitectureTest test

      - name: Run complete test suite
        working-directory: auth-service
        run: bash ./mvnw --batch-mode --no-transfer-progress test

      - name: Build container image
        run: docker build --tag dss-auth-service:${{ github.sha }} ./auth-service

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-${{ github.sha }}
          path: auth-service/target/auth-service-*.jar
          if-no-files-found: error
          retention-days: 7
