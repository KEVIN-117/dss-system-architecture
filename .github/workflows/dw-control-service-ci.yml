name: DW Control Service CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dw-control-service-ci.yml"
      - "dw-control-service/**"
      - "infra/keycloak/realm/**"
      - "docs/envs/dw-control-service.md"
      - ".env.example"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dw-control-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, and verify image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            dw-control-service/gradle/wrapper/gradle-wrapper.properties
            dw-control-service/settings.gradle
            dw-control-service/build.gradle

      - name: Run lint, tests, and build
        working-directory: dw-control-service
        run: bash ./gradlew --no-daemon lint test bootJar

      - name: Build container image
        run: docker build --tag dss-dw-control-service:${{ github.sha }} ./dw-control-service

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: dw-control-service-${{ github.sha }}
          path: dw-control-service/build/libs/dw-control-service.jar
          if-no-files-found: error
          retention-days: 7
