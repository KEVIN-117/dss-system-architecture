name: Container CI and Releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/release-please-config.json"
      - ".release-please-manifest.json"
      - ".env.example"
      - "docker-compose.yml"
      - "auth-service/**"
      - "infra/keycloak/**"
      - "keycloak-webhook/**"
      - "olap-service/**"
      - "etl-layer/apache-hop/**"
      - "infra/dw-schema/**"
      - "infra/dw-integration/**"
      - "infra/dw-test-data/**"
      - "docs/dw/**"
      - "docs/envs/dw-control-service.md"
      - "dw-control-service/**"
      - "dss-monorepo/**"
  workflow_dispatch:
    inputs:
      publish_keycloak:
        description: Republish the current Keycloak release from the manifest
        required: false
        type: boolean
        default: false
      publish_olap:
        description: Republish the current OLAP service release from the manifest
        required: false
        type: boolean
        default: false
      publish_apache_hop:
        description: Republish the current Apache Hop release from the manifest
        required: false
        type: boolean
        default: false
      publish_dw_migrator:
        description: Republish the current DW migrator release from the manifest
        required: false
        type: boolean
        default: false
      publish_dw_control_service:
        description: Republish the current DW Control Service release from the manifest
        required: false
        type: boolean
        default: false
      publish_dss_bff:
        description: Republish the current BFF release from the manifest
        required: false
        type: boolean
        default: false
      publish_dss_admin_portal:
        description: Republish the current admin portal release from the manifest
        required: false
        type: boolean
        default: false
      publish_dss_director_dashboard:
        description: Republish the current director dashboard release from the manifest
        required: false
        type: boolean
        default: false
      publish_dss_decano_dashboard:
        description: Republish the current decano dashboard release from the manifest
        required: false
        type: boolean
        default: false
      publish_dss_rector_dashboard:
        description: Republish the current rector dashboard release from the manifest
        required: false
        type: boolean
        default: false
      publish_dss_landing:
        description: Republish the current landing release from the manifest
        required: false
        type: boolean
        default: false
      publish_dss_docs_portal:
        description: Republish the current docs portal release from the manifest
        required: false
        type: boolean
        default: false
      publish_dss_olap_workspace:
        description: Republish the current OLAP workspace release from the manifest
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-auth-service:
    name: Verify auth-service
    uses: ./.github/workflows/auth-service-ci.yml

  verify-keycloak:
    name: Verify Keycloak
    uses: ./.github/workflows/keycloak-ci.yml

  verify-olap-service:
    name: Verify OLAP service
    uses: ./.github/workflows/olap-service-ci.yml
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  verify-apache-hop:
    name: Verify Apache Hop and DW migrations
    uses: ./.github/workflows/dw-hop-ci.yml

  verify-dw-control-service:
    name: Verify DW Control Service
    uses: ./.github/workflows/dw-control-service-ci.yml

  verify-dss-monorepo:
    name: Verify affected DSS frontend projects
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit

  release-please:
    name: Create component release PRs or GitHub releases
    if: github.ref == 'refs/heads/main'
    needs:
      - verify-auth-service
      - verify-keycloak
      - verify-olap-service
      - verify-apache-hop
      - verify-dw-control-service
      - verify-dss-monorepo
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      auth_release_created: ${{ steps.release.outputs['auth-service--release_created'] }}
      auth_version: ${{ steps.release.outputs['auth-service--version'] }}
      auth_major: ${{ steps.release.outputs['auth-service--major'] }}
      auth_minor: ${{ steps.release.outputs['auth-service--minor'] }}
      keycloak_release_created: ${{ steps.release.outputs['infra/keycloak--release_created'] }}
      keycloak_version: ${{ steps.release.outputs['infra/keycloak--version'] || steps.manifest.outputs.keycloak_version }}
      keycloak_major: ${{ steps.release.outputs['infra/keycloak--major'] || steps.manifest.outputs.keycloak_major }}
      keycloak_minor: ${{ steps.release.outputs['infra/keycloak--minor'] || steps.manifest.outputs.keycloak_minor }}
      olap_release_created: ${{ steps.release.outputs['olap-service--release_created'] }}
      olap_version: ${{ steps.release.outputs['olap-service--version'] || steps.manifest.outputs.olap_version }}
      olap_major: ${{ steps.release.outputs['olap-service--major'] || steps.manifest.outputs.olap_major }}
      olap_minor: ${{ steps.release.outputs['olap-service--minor'] || steps.manifest.outputs.olap_minor }}
      hop_release_created: ${{ steps.release.outputs['etl-layer/apache-hop--release_created'] }}
      hop_version: ${{ steps.release.outputs['etl-layer/apache-hop--version'] || steps.manifest.outputs.hop_version }}
      hop_major: ${{ steps.release.outputs['etl-layer/apache-hop--major'] || steps.manifest.outputs.hop_major }}
      hop_minor: ${{ steps.release.outputs['etl-layer/apache-hop--minor'] || steps.manifest.outputs.hop_minor }}
      dw_migrator_release_created: ${{ steps.release.outputs['infra/dw-schema--release_created'] }}
      dw_migrator_version: ${{ steps.release.outputs['infra/dw-schema--version'] || steps.manifest.outputs.dw_migrator_version }}
      dw_migrator_major: ${{ steps.release.outputs['infra/dw-schema--major'] || steps.manifest.outputs.dw_migrator_major }}
      dw_migrator_minor: ${{ steps.release.outputs['infra/dw-schema--minor'] || steps.manifest.outputs.dw_migrator_minor }}
      dw_control_service_release_created: ${{ steps.release.outputs['dw-control-service--release_created'] }}
      dw_control_service_version: ${{ steps.release.outputs['dw-control-service--version'] || steps.manifest.outputs.dw_control_service_version }}
      dw_control_service_major: ${{ steps.release.outputs['dw-control-service--major'] || steps.manifest.outputs.dw_control_service_major }}
      dw_control_service_minor: ${{ steps.release.outputs['dw-control-service--minor'] || steps.manifest.outputs.dw_control_service_minor }}
      dss_bff_release_created: ${{ steps.release.outputs['dss-monorepo/apps/bff--release_created'] }}
      dss_bff_version: ${{ steps.release.outputs['dss-monorepo/apps/bff--version'] || steps.manifest.outputs.dss_bff_version }}
      dss_bff_major: ${{ steps.release.outputs['dss-monorepo/apps/bff--major'] || steps.manifest.outputs.dss_bff_major }}
      dss_bff_minor: ${{ steps.release.outputs['dss-monorepo/apps/bff--minor'] || steps.manifest.outputs.dss_bff_minor }}
      dss_admin_portal_release_created: ${{ steps.release.outputs['dss-monorepo/apps/admin-portal--release_created'] }}
      dss_admin_portal_version: ${{ steps.release.outputs['dss-monorepo/apps/admin-portal--version'] || steps.manifest.outputs.dss_admin_portal_version }}
      dss_admin_portal_major: ${{ steps.release.outputs['dss-monorepo/apps/admin-portal--major'] || steps.manifest.outputs.dss_admin_portal_major }}
      dss_admin_portal_minor: ${{ steps.release.outputs['dss-monorepo/apps/admin-portal--minor'] || steps.manifest.outputs.dss_admin_portal_minor }}
      dss_director_dashboard_release_created: ${{ steps.release.outputs['dss-monorepo/apps/director-dashboard--release_created'] }}
      dss_director_dashboard_version: ${{ steps.release.outputs['dss-monorepo/apps/director-dashboard--version'] || steps.manifest.outputs.dss_director_dashboard_version }}
      dss_director_dashboard_major: ${{ steps.release.outputs['dss-monorepo/apps/director-dashboard--major'] || steps.manifest.outputs.dss_director_dashboard_major }}
      dss_director_dashboard_minor: ${{ steps.release.outputs['dss-monorepo/apps/director-dashboard--minor'] || steps.manifest.outputs.dss_director_dashboard_minor }}
      dss_decano_dashboard_release_created: ${{ steps.release.outputs['dss-monorepo/apps/decano-dashboard--release_created'] }}
      dss_decano_dashboard_version: ${{ steps.release.outputs['dss-monorepo/apps/decano-dashboard--version'] || steps.manifest.outputs.dss_decano_dashboard_version }}
      dss_decano_dashboard_major: ${{ steps.release.outputs['dss-monorepo/apps/decano-dashboard--major'] || steps.manifest.outputs.dss_decano_dashboard_major }}
      dss_decano_dashboard_minor: ${{ steps.release.outputs['dss-monorepo/apps/decano-dashboard--minor'] || steps.manifest.outputs.dss_decano_dashboard_minor }}
      dss_rector_dashboard_release_created: ${{ steps.release.outputs['dss-monorepo/apps/rector-dashboard--release_created'] }}
      dss_rector_dashboard_version: ${{ steps.release.outputs['dss-monorepo/apps/rector-dashboard--version'] || steps.manifest.outputs.dss_rector_dashboard_version }}
      dss_rector_dashboard_major: ${{ steps.release.outputs['dss-monorepo/apps/rector-dashboard--major'] || steps.manifest.outputs.dss_rector_dashboard_major }}
      dss_rector_dashboard_minor: ${{ steps.release.outputs['dss-monorepo/apps/rector-dashboard--minor'] || steps.manifest.outputs.dss_rector_dashboard_minor }}
      dss_landing_release_created: ${{ steps.release.outputs['dss-monorepo/apps/landing--release_created'] }}
      dss_landing_version: ${{ steps.release.outputs['dss-monorepo/apps/landing--version'] || steps.manifest.outputs.dss_landing_version }}
      dss_landing_major: ${{ steps.release.outputs['dss-monorepo/apps/landing--major'] || steps.manifest.outputs.dss_landing_major }}
      dss_landing_minor: ${{ steps.release.outputs['dss-monorepo/apps/landing--minor'] || steps.manifest.outputs.dss_landing_minor }}
      dss_docs_portal_release_created: ${{ steps.release.outputs['dss-monorepo/apps/docs-portal--release_created'] }}
      dss_docs_portal_version: ${{ steps.release.outputs['dss-monorepo/apps/docs-portal--version'] || steps.manifest.outputs.dss_docs_portal_version }}
      dss_docs_portal_major: ${{ steps.release.outputs['dss-monorepo/apps/docs-portal--major'] || steps.manifest.outputs.dss_docs_portal_major }}
      dss_docs_portal_minor: ${{ steps.release.outputs['dss-monorepo/apps/docs-portal--minor'] || steps.manifest.outputs.dss_docs_portal_minor }}
      dss_olap_workspace_release_created: ${{ steps.release.outputs['dss-monorepo/apps/olap-workspace--release_created'] }}
      dss_olap_workspace_version: ${{ steps.release.outputs['dss-monorepo/apps/olap-workspace--version'] || steps.manifest.outputs.dss_olap_workspace_version }}
      dss_olap_workspace_major: ${{ steps.release.outputs['dss-monorepo/apps/olap-workspace--major'] || steps.manifest.outputs.dss_olap_workspace_major }}
      dss_olap_workspace_minor: ${{ steps.release.outputs['dss-monorepo/apps/olap-workspace--minor'] || steps.manifest.outputs.dss_olap_workspace_minor }}
    steps:
      - uses: actions/checkout@v4
      - name: Read current component versions
        id: manifest
        shell: bash
        run: |
          while IFS=' ' read -r output component; do
            version="$(jq -r --arg component "$component" '.[$component]' .release-please-manifest.json)"
            IFS='.' read -r major minor _ <<< "$version"
            echo "${output}_version=$version" >> "$GITHUB_OUTPUT"
            echo "${output}_major=$major" >> "$GITHUB_OUTPUT"
            echo "${output}_minor=$minor" >> "$GITHUB_OUTPUT"
          done <<'VERSIONS'
          keycloak infra/keycloak
          olap olap-service
          hop etl-layer/apache-hop
          dw_migrator infra/dw-schema
          dw_control_service dw-control-service
          dss_bff dss-monorepo/apps/bff
          dss_admin_portal dss-monorepo/apps/admin-portal
          dss_director_dashboard dss-monorepo/apps/director-dashboard
          dss_decano_dashboard dss-monorepo/apps/decano-dashboard
          dss_rector_dashboard dss-monorepo/apps/rector-dashboard
          dss_landing dss-monorepo/apps/landing
          dss_docs_portal dss-monorepo/apps/docs-portal
          dss_olap_workspace dss-monorepo/apps/olap-workspace
          VERSIONS
      - name: Require release automation token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: test -n "$RELEASE_PLEASE_TOKEN" || { echo "Configure the RELEASE_PLEASE_TOKEN Actions secret so Release Please PR checks are triggered" >&2; exit 1; }
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-auth-service:
    name: Publish auth-service
    if: needs.release-please.outputs.auth_release_created == 'true'
    needs: [verify-auth-service, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dss-auth-service
          tags: |
            type=raw,value=${{ needs.release-please.outputs.auth_version }}
            type=raw,value=${{ needs.release-please.outputs.auth_major }}
            type=raw,value=${{ needs.release-please.outputs.auth_major }}.${{ needs.release-please.outputs.auth_minor }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: auth-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,mode=max,scope=auth-service
          sbom: true
          provenance: mode=max

  publish-keycloak:
    name: Publish Keycloak
    if: >-
      needs.release-please.outputs.keycloak_release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_keycloak && needs.release-please.outputs.keycloak_version != '0.0.0')
    needs: [verify-keycloak, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download tested Keycloak provider
        uses: actions/download-artifact@v4
        with:
          name: keycloak-provider
          path: infra/keycloak/providers
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dss-keycloak
          tags: |
            type=raw,value=${{ needs.release-please.outputs.keycloak_version }}
            type=raw,value=${{ needs.release-please.outputs.keycloak_major }}
            type=raw,value=${{ needs.release-please.outputs.keycloak_major }}.${{ needs.release-please.outputs.keycloak_minor }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: infra/keycloak
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak
          sbom: true
          provenance: mode=max

  publish-olap-service:
    name: Publish OLAP service
    if: >-
      needs.release-please.outputs.olap_release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_olap && needs.release-please.outputs.olap_version != '0.0.0')
    needs: [verify-olap-service, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download tested OLAP launcher
        uses: actions/download-artifact@v4
        with:
          name: olap-launcher
          path: olap-service/build-context
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dss-olap-service
          tags: |
            type=raw,value=${{ needs.release-please.outputs.olap_version }}
            type=raw,value=${{ needs.release-please.outputs.olap_major }}
            type=raw,value=${{ needs.release-please.outputs.olap_major }}.${{ needs.release-please.outputs.olap_minor }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: olap-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=olap-service
          cache-to: type=gha,mode=max,scope=olap-service
          sbom: true
          provenance: mode=max

  publish-apache-hop:
    name: Publish Apache Hop
    if: >-
      needs.release-please.outputs.hop_release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_apache_hop && needs.release-please.outputs.hop_version != '0.0.0')
    needs: [verify-apache-hop, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned PostgreSQL JDBC driver
        run: bash etl-layer/apache-hop/scripts/download-postgres-jdbc.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dss-apache-hop
          tags: |
            type=raw,value=${{ needs.release-please.outputs.hop_version }}
            type=raw,value=${{ needs.release-please.outputs.hop_major }}
            type=raw,value=${{ needs.release-please.outputs.hop_major }}.${{ needs.release-please.outputs.hop_minor }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: etl-layer/apache-hop
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=apache-hop
          cache-to: type=gha,mode=max,scope=apache-hop
          sbom: true
          provenance: mode=max

  publish-dw-migrator:
    name: Publish DW migrator
    if: >-
      needs.release-please.outputs.dw_migrator_release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_dw_migrator && needs.release-please.outputs.dw_migrator_version != '0.0.0')
    needs: [verify-apache-hop, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dss-dw-migrator
          tags: |
            type=raw,value=${{ needs.release-please.outputs.dw_migrator_version }}
            type=raw,value=${{ needs.release-please.outputs.dw_migrator_major }}
            type=raw,value=${{ needs.release-please.outputs.dw_migrator_major }}.${{ needs.release-please.outputs.dw_migrator_minor }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: infra/dw-schema
          push: true
          build-args: |
            MIGRATIONS_VERSION=${{ needs.release-please.outputs.dw_migrator_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dw-migrator
          cache-to: type=gha,mode=max,scope=dw-migrator
          sbom: true
          provenance: mode=max

  publish-dw-control-service:
    name: Publish DW Control Service
    if: >-
      needs.release-please.outputs.dw_control_service_release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_dw_control_service && needs.release-please.outputs.dw_control_service_version != '0.0.0')
    needs: [verify-dw-control-service, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dss-dw-control-service
          tags: |
            type=raw,value=${{ needs.release-please.outputs.dw_control_service_version }}
            type=raw,value=${{ needs.release-please.outputs.dw_control_service_major }}
            type=raw,value=${{ needs.release-please.outputs.dw_control_service_major }}.${{ needs.release-please.outputs.dw_control_service_minor }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: dw-control-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dw-control-service
          cache-to: type=gha,mode=max,scope=dw-control-service
          sbom: true
          provenance: mode=max

  publish-dss-bff:
    name: Publish bff
    if: >-
      needs.release-please.outputs.dss_bff_release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_dss_bff && needs.release-please.outputs.dss_bff_version != '0.0.0')
    needs: [verify-dss-monorepo, release-please]
    uses: ./.github/workflows/publish-nextjs-app.yml
    with:
      app_name: bff
      image_name: dss-bff
      version: ${{ needs.release-please.outputs.dss_bff_version }}
      major: ${{ needs.release-please.outputs.dss_bff_major }}
      minor: ${{ needs.release-please.outputs.dss_bff_minor }}
    secrets: inherit

  publish-dss-admin-portal:
    name: Publish admin-portal
    if: >-
      needs.release-please.outputs.dss_admin_portal_release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_dss_admin_portal && needs.release-please.outputs.dss_admin_portal_version != '0.0.0')
    needs: [verify-dss-monorepo, release-please]
    uses: ./.github/workflows/publish-nextjs-app.yml
    with:
      app_name: admin-portal
      image_name: dss-admin-portal
      version: ${{ needs.release-please.outputs.dss_admin_portal_version }}
      major: ${{ needs.release-please.outputs.dss_admin_portal_major }}
      minor: ${{ needs.release-please.outputs.dss_admin_portal_minor }}
    secrets: inherit

  publish-dss-director-dashboard:
    name: Publish director-dashboard
    if: >-
      needs.release-please.outputs.dss_director_dashboard_release_created == 'true' ||
