name: DSS Monorepo CI

on:
  pull_request:
    paths:
      - "dss-monorepo/**"
      - ".github/workflows/**"
      - ".github/actions/setup-dss-monorepo/**"
      - ".github/release-please-config.json"
      - ".release-please-manifest.json"
  workflow_call:

permissions:
  actions: read
  contents: read

concurrency:
  group: dss-monorepo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Nx Cloud is not used: the organization exceeded its free plan. Task
  # results are reused through the local .nx cache persisted by actions/cache.
  NX_NO_CLOUD: true
  LANDING_PORT: 3000
  ADMIN_PORTAL_PORT: 3001
  DECANO_DASHBOARD_PORT: 3002
  DIRECTOR_DASHBOARD_PORT: 3003
  RECTOR_DASHBOARD_PORT: 3004
  BFF_PORT: 3006
  NEXT_PUBLIC_BFF_URL: http://localhost:3006
  NEXT_PUBLIC_ADMIN_PORTAL_URL: http://localhost:3001
  NEXT_PUBLIC_RECTOR_DASHBOARD_URL: http://localhost:3004
  NEXT_PUBLIC_DECANO_DASHBOARD_URL: http://localhost:3002
  NEXT_PUBLIC_DIRECTOR_DASHBOARD_URL: http://localhost:3003
  KEYCLOAK_URL: http://localhost:8080
  KEYCLOAK_REALM: uatf-dss-realm
  KEYCLOAK_AUDIENCE: uatf-auth-service
  KEYCLOAK_BFF_CLIENT_ID: dss-bff
  KEYCLOAK_BFF_CLIENT_SECRET: ci-client-secret-not-used-in-production
  KEYCLOAK_OLAP_CLIENT_SECRET: ci-client-secret-not-used-in-production
  KEYCLOAK_AUTH_SERVICE_CLIENT_SECRET: ci-client-secret-not-used-in-production
  KEYCLOAK_BFF_REDIRECT_URI: http://localhost:3006/api/auth/callback
  KEYCLOAK_BFF_POST_LOGOUT_REDIRECT_URI: http://localhost:3000/login
  AUTH_SERVICE_URL: http://localhost:8000
  BFF_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
  BFF_DEFAULT_POST_LOGIN_REDIRECT_URI: http://localhost:3000/auth/callback
  BFF_SESSION_SECRET: ci-session-secret-not-used-in-production-123456
  BFF_SESSION_IDLE_TIMEOUT_SECONDS: 1800
  BFF_SESSION_MAX_LIFETIME_SECONDS: 36000
  BFF_SESSION_COOKIE: dss_session

jobs:
  plan:
    name: Detect affected applications
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dss-monorepo
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v5
      - uses: ./.github/actions/setup-dss-monorepo
        with:
          nx-cache-scope: plan
      - name: List affected applications
        id: affected
        shell: bash
        run: |
          projects=$(bun nx show projects --affected --json 2>/dev/null | grep -E '^\[' | tail -n1)
          projects=${projects:-[]}
          dirs=$(ls -1 apps | jq -R . | jq -sc .)
          # An app shard runs when the app or its -e2e project is affected.
          apps=$(jq -c --argjson dirs "$dirs" \
            '[.[] | sub("^@dss-monorepo/"; "") | sub("-e2e$"; "") | select(. as $p | $dirs | index($p))] | unique' \
            <<< "$projects")
          echo "Affected projects: $projects"
          echo "Application shards: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  quality:
    name: Affected lint, tests, and library builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dss-monorepo
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v5
      - uses: ./.github/actions/setup-dss-monorepo
        with:
          nx-cache-scope: quality
      - name: Run affected lint and tests
        run: bun nx affected -t lint test --parallel=3
      # Application builds run in their e2e shard next to the tests that use them.
      - name: Build affected libraries
        run: bun nx affected -t build --parallel=3 --exclude='tag:type:app,tag:type:bff,tag:type:e2e'

  e2e:
    name: Build and E2E ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.apps != '[]' && needs.plan.outputs.apps != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    defaults:
      run:
        working-directory: dss-monorepo
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: ./.github/actions/setup-dss-monorepo
        with:
          nx-cache-scope: e2e-${{ matrix.app }}
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: bun run playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: bun run playwright install-deps chromium
      # The inferred e2e target has no dependsOn, so running build and e2e in
      # one command starts the Playwright `next dev` server before the
      # libraries' dist/ outputs exist ("Can't resolve '@dss-monorepo/auth'").
      - name: Build ${{ matrix.app }} and its libraries
        run: bun nx run-many -t build -p "@dss-monorepo/${{ matrix.app }}"
      - name: E2E ${{ matrix.app }}
        run: bun nx run-many -t e2e -p "@dss-monorepo/${{ matrix.app }}-e2e"
