name: OLAP Service CI

on:
  workflow_call:
    secrets:
      GH_PACKAGES_TOKEN:
        required: false
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/olap-service-ci.yml"
      - ".github/workflows/container-release.yml"
      - "olap-service/**"
      - "docker-compose.yml"
      - "docker/initialize-academic-olap.sh"
      - "infra/olap/**"
      - ".env.example"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Saiku OLAP and build image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven
          cache-dependency-path: olap-service/pom.xml

      - name: Configure Maven credentials for private dependencies
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          test -n "$GH_PACKAGES_TOKEN" || { echo "GH_PACKAGES_TOKEN is required to resolve OLAP dependencies" >&2; exit 1; }
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server><id>github-mondrian-saiku</id><username>${GH_PACKAGES_USER}</username><password>${GH_PACKAGES_TOKEN}</password></server>
              <server><id>github-olap4j</id><username>${GH_PACKAGES_USER}</username><password>${GH_PACKAGES_TOKEN}</password></server>
              <server><id>github-olap4j-xmlaserver</id><username>${GH_PACKAGES_USER}</username><password>${GH_PACKAGES_TOKEN}</password></server>
              <server><id>github-saiku-query</id><username>${GH_PACKAGES_USER}</username><password>${GH_PACKAGES_TOKEN}</password></server>
              <server><id>github-ossie</id><username>${GH_PACKAGES_USER}</username><password>${GH_PACKAGES_TOKEN}</password></server>
            </servers>
          </settings>
          EOF

      - name: Run complete OLAP verification suite
        working-directory: olap-service
        run: mvn --batch-mode --no-transfer-progress -DskipTests=false verify

      - name: Stage launcher JAR for Docker build
        working-directory: olap-service
        run: |
          version=$(mvn --batch-mode --no-transfer-progress -q -pl saiku-launcher help:evaluate -Dexpression=project.version -DforceStdout)
          mkdir -p build-context
          cp "saiku-launcher/target/saiku-${version}.jar" build-context/saiku.jar

      - name: Build OLAP service image
        run: docker build --tag dss-olap-service:${{ github.sha }} olap-service

      - name: Upload tested OLAP launcher
        uses: actions/upload-artifact@v4
        with:
          name: olap-launcher
          path: olap-service/build-context/saiku.jar
          if-no-files-found: error
          retention-days: 1
