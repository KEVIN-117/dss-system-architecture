spring:
  application:
    name: dw-control-service
  profiles:
    active: ${DW_CONTROL_PROFILE:prod}
  datasource:
    url: ${DW_CONTROL_DB_URL:jdbc:postgresql://localhost:5434/dss_dw}
    username: ${DW_CONTROL_DB_USERNAME:dw_control_runtime}
    password: ${DW_CONTROL_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DW_CONTROL_DB_POOL_SIZE:8}
      connection-timeout: ${DW_CONTROL_DB_CONNECTION_TIMEOUT_MS:5000}

server:
  port: ${DW_CONTROL_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}

springdoc:
  api-docs:
    enabled: ${DW_CONTROL_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${DW_CONTROL_OPENAPI_ENABLED:false}
    path: /swagger-ui.html
  packages-to-scan: chronos.dw.admin.adapter.in.rest

app:
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
      audience: ${KEYCLOAK_DW_CONTROL_AUDIENCE:dw-control-service}
      # Catalog client of the permissions dw:closure:read, dw:closure:manage and dw:etl-monitor:read (IAM-011).
      permissions-client-id: ${KEYCLOAK_PERMISSIONS_CLIENT_ID:dss-permissions}
  # Load Manager (LM-003): Hop Server execution engine (docs/dw/hop-server-contract.md).
  etl:
    hop:
      base-url: ${DW_CONTROL_HOP_SERVER_URL:http://hop-server:8080}
      # Same credentials as the hop-server container (HOP_SERVER_USER / HOP_SERVER_PASS).
      username: ${HOP_SERVER_USER:}
      password: ${HOP_SERVER_PASS:}
      connect-timeout: ${DW_CONTROL_HOP_CONNECT_TIMEOUT:5s}
      read-timeout: ${DW_CONTROL_HOP_READ_TIMEOUT:30s}
      project-home: /files/project
    monitoring:
      # Disable to run an API-only instance; at least one instance must keep it on.
      enabled: ${DW_CONTROL_ETL_MONITORING_ENABLED:true}
      interval-ms: ${DW_CONTROL_ETL_MONITORING_INTERVAL_MS:5000}
      batch-size: 20
      not-found-grace: 2m
      queued-grace: 5m
      log-excerpt-max-chars: 65536
