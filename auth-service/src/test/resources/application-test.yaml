spring:
  # using @ServiceConnection for datasource
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/auth-test

server:
  servlet:
    context-path: /api/v1

logging:
  level:
    org.springframework.boot.autoconfigure: DEBUG
    org.flywaydb: DEBUG

debug: true

jwt:
  auth:
    converter:
      resource-id: uatf-auth-service
      principal-attribute: preferred_username

app:
  security:
    webhook-secret: test-webhook-secret
    jwt-audience: uatf-auth-service
    cors:
      allowed-origins: http://localhost:3001

KEYCLOAK_JWK_SET_URI: http://localhost:8081/realms/auth-test/protocol/openid-connect/certs
