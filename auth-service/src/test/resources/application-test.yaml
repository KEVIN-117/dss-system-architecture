spring:
  # using @ServiceConnection for datasource
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/auth-test

logging:
  level:
    org.springframework.boot.autoconfigure: DEBUG
    org.flywaydb: DEBUG

debug: true
