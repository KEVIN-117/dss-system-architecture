springdoc:
  api-docs:
    enabled: ${AUTH_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${AUTH_API_DOCS_ENABLED:true}

spring:
  datasource:
    url: ${DB_URI}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
app:
  security:
    jwt-audience: ${KEYCLOAK_AUDIENCE:${KEYCLOAK_RESOURCE_ID}}
    cors:
      allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005}

jwt:
  auth:
    converter:
      resource-id: ${KEYCLOAK_RESOURCE_ID}
      principal-attribute: ${KEYCLOAK_PRINCIPAL_ATTRIBUTE}

logging:
  level:
    root: info
    org.springframework.web: info
    org.hibernate.sql: info
    org.hibernate.type.descriptor.sql: trace
debug: true
