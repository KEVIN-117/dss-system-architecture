spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILE_ACTIVE:dev}
  banner:
    location: static/custom-banner.txt
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_DEFAULT_USER:guest}}
    password: ${RABBITMQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:guest}}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1s
        max-attempts: 3
        multiplier: 2
        max-interval: 5s
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2
          max-interval: 5s

springdoc:
  api-docs:
    enabled: ${AUTH_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${AUTH_API_DOCS_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/${API_VERSION:v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

jwt:
  auth:
    converter:
      resource-id: ${KEYCLOAK_RESOURCE_ID:uatf-auth-service}
      principal-attribute: ${KEYCLOAK_PRINCIPAL_ATTRIBUTE:preferred_username}
      # Catalog client whose roles are functional permissions (resource:action). IAM-004.
      permissions-client-id: ${KEYCLOAK_PERMISSIONS_CLIENT_ID:dss-permissions}

app:
  security:
    jwt-audience: ${KEYCLOAK_AUDIENCE:${KEYCLOAK_RESOURCE_ID:uatf-auth-service}}
    context-reader:
      # Keycloak clients (token azp) allowed to call /internal/users/{id}/academic-contexts.
      allowed-clients: ${AUTH_CONTEXT_READER_CLIENTS:olap-service}
  keycloak:
    # Keycloak Admin REST API with the uatf-auth-service service account (client_credentials). IAM-003.
    admin:
      base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
      realm: ${KEYCLOAK_ADMIN_REALM:uatf-dss-realm}
      client-id: ${KEYCLOAK_AUTH_SERVICE_CLIENT_ID:uatf-auth-service}
      # Without it the service starts, but identity-administration calls answer 503.
      client-secret: ${KEYCLOAK_AUTH_SERVICE_CLIENT_SECRET:}
      connect-timeout: ${KEYCLOAK_ADMIN_CONNECT_TIMEOUT:2s}
      read-timeout: ${KEYCLOAK_ADMIN_READ_TIMEOUT:5s}
      max-retries: ${KEYCLOAK_ADMIN_MAX_RETRIES:2}
      retry-backoff: 200ms
      token-expiry-skew: 30s
