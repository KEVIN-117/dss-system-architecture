spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILE_ACTIVE:dev}
  banner:
    location: static/custom-banner.txt
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_DEFAULT_USER:guest}}
    password: ${RABBITMQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:guest}}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1s
        max-attempts: 3
        multiplier: 2
        max-interval: 5s
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2
          max-interval: 5s

springdoc:
  api-docs:
    enabled: ${AUTH_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${AUTH_API_DOCS_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/${API_VERSION:v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

jwt:
  auth:
    converter:
      resource-id: ${KEYCLOAK_RESOURCE_ID:uatf-auth-service}
      principal-attribute: ${KEYCLOAK_PRINCIPAL_ATTRIBUTE:preferred_username}

app:
  security:
    jwt-audience: ${KEYCLOAK_AUDIENCE:${KEYCLOAK_RESOURCE_ID:uatf-auth-service}}
