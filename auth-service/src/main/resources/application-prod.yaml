spring:
  datasource:
    url: ${DB_URI}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
server:
  port: ${SERVER_PORT}

app:
  security:
    jwt-audience: ${KEYCLOAK_AUDIENCE:${KEYCLOAK_RESOURCE_ID}}
    cors:
      allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS}
      require-https: true
