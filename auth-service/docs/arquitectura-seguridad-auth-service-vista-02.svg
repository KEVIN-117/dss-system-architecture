<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sync-sec-title sync-sec-desc" id="arquitectura-seguridad-auth-service-root">
        <title id="sync-sec-title">Eventos de Keycloak y catálogo académico</title>
        <desc id="sync-sec-desc">Keycloak publica eventos administrativos persistentes en RabbitMQ. El consumidor valida y deduplica los eventos, SyncUserService guarda el perfil y los roles reconocidos en PostgreSQL IAM; Apache Hop sincroniza allí el catálogo académico desde Jachasun.</desc>
        <defs>
          <marker id="arquitectura-seguridad-auth-service-sync-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#526e74"/></marker>
          <marker id="arquitectura-seguridad-auth-service-sync-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#187ea2"/></marker>
          <marker id="arquitectura-seguridad-auth-service-sync-arrow-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#168f9a"/></marker>
        </defs>
        <rect width="640" height="680" fill="#f1f5f4"/>

        <!-- Separate logical boundaries: identity, broker, auth-service, and catalog feed -->
        <rect x="44" y="24" width="356" height="102" rx="8" fill="#e9f0ef" stroke="#b7cdcd" stroke-width="1"/>
        <rect x="54" y="16" width="183" height="17" rx="2" fill="#f1f5f4"/>
        <text x="60" y="28" fill="#6c8589" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" letter-spacing="1">KEYCLOAK · EXTERNO</text>
        <rect x="44" y="128" width="356" height="82" rx="8" fill="#e9f0ef" stroke="#b7cdcd" stroke-width="1"/>
        <rect x="54" y="120" width="174" height="17" rx="2" fill="#f1f5f4"/>
        <text x="60" y="132" fill="#6c8589" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" letter-spacing="1">RABBITMQ · EXTERNO</text>
        <rect x="44" y="224" width="356" height="424" rx="8" fill="#e9f0ef" stroke="#9ab5b8" stroke-width="1"/>
        <rect x="54" y="216" width="230" height="17" rx="2" fill="#f1f5f4"/>
        <text x="60" y="228" fill="#6c8589" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" letter-spacing="1">AUTH-SERVICE · LÍMITE LÓGICO</text>
        <rect x="412" y="414" width="184" height="150" rx="8" fill="#e9f0ef" stroke="#b7cdcd" stroke-width="1"/>
        <rect x="420" y="406" width="163" height="17" rx="2" fill="#f1f5f4"/>
        <text x="426" y="418" fill="#6c8589" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="500" letter-spacing=".6">CATÁLOGO · EXTERNO</text>

        <!-- Main event-sync path and independent catalog path -->
        <path d="M222 106 V145" fill="none" stroke="#187ea2" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arquitectura-seguridad-auth-service-sync-arrow-blue)"/>
        <path d="M222 203 V246" fill="none" stroke="#526e74" stroke-width="1.2" marker-end="url(#arquitectura-seguridad-auth-service-sync-arrow)"/>
        <line x1="222" y1="306" x2="222" y2="326" stroke="#526e74" stroke-width="1.2" marker-end="url(#arquitectura-seguridad-auth-service-sync-arrow)"/>
        <line x1="222" y1="396" x2="222" y2="418" stroke="#526e74" stroke-width="1.2" marker-end="url(#arquitectura-seguridad-auth-service-sync-arrow)"/>
        <line x1="222" y1="474" x2="222" y2="540" stroke="#526e74" stroke-width="1.2" marker-end="url(#arquitectura-seguridad-auth-service-sync-arrow)"/>
        <path d="M504 554 V572 H380 Q372 572 372 580" fill="none" stroke="#168f9a" stroke-width="1.3" marker-end="url(#arquitectura-seguridad-auth-service-sync-arrow-teal)"/>

        <rect x="236" y="211" width="104" height="13" rx="2" fill="#f1f5f4"/>
        <text x="288" y="221" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8">EVENT DELIVERY</text>
        <rect x="512" y="513" width="56" height="13" rx="2" fill="#f1f5f4"/>
        <text x="540" y="523" text-anchor="middle" fill="#168f9a" font-family="'Geist Mono', monospace" font-size="8">CATALOG</text>

        <!-- Keycloak Event Listener SPI -->
        <rect x="72" y="42" width="300" height="64" rx="6" fill="#fff" stroke="#168f9a" stroke-width="1.4"/>
        <circle cx="94" cy="62" r="5" fill="none" stroke="#168f9a" stroke-width="1.4"/>
        <circle cx="106" cy="75" r="3" fill="none" stroke="#168f9a" stroke-width="1.3"/>
        <path d="M98 65 104 72" stroke="#168f9a" stroke-width="1.3"/>
        <text x="235" y="63" text-anchor="middle" fill="#173d45" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600">Event Listener SPI · uatf-webhook</text>
        <text x="222" y="81" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8.5">Admin Events: alta/modificación · cambios de roles</text>
        <text x="222" y="97" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8.5">emite snapshots de perfil + roles · hasta 3 reintentos</text>

        <!-- Durable broker boundary -->
        <rect x="72" y="145" width="300" height="58" rx="6" fill="#fff" stroke="#187ea2" stroke-width="1.2"/>
        <circle cx="96" cy="165" r="4" fill="none" stroke="#187ea2" stroke-width="1.3"/>
        <circle cx="108" cy="165" r="4" fill="none" stroke="#187ea2" stroke-width="1.3"/>
        <circle cx="102" cy="178" r="4" fill="none" stroke="#187ea2" stroke-width="1.3"/>
        <path d="M99 165h6m-1 3-2 6" stroke="#187ea2" stroke-width="1.2"/>
        <text x="235" y="168" text-anchor="middle" fill="#173d45" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600">RabbitMQ · colas durables</text>
        <text x="222" y="185" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8.5">keycloak.user.events · DLQ keycloak.user.events.dlq</text>
        <text x="222" y="199" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8">persistente · confirm · fallos agotados → DLQ</text>

        <!-- Consumer and sync service -->
        <rect x="72" y="246" width="300" height="60" rx="6" fill="#fff" stroke="#187ea2" stroke-width="1.2"/>
        <text x="222" y="268" text-anchor="middle" fill="#173d45" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600">KeycloakUserEventConsumer</text>
        <text x="222" y="285" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8.5">valida eventId + UUID · inbox deduplica</text>
        <text x="222" y="300" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8">processed_keycloak_events</text>

        <rect x="72" y="326" width="300" height="70" rx="6" fill="#fff" stroke="#168f9a" stroke-width="1.3"/>
        <text x="222" y="349" text-anchor="middle" fill="#173d45" font-family="'Geist', sans-serif" font-size="12" font-weight="600">SyncUserService</text>
        <text x="222" y="367" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8.5">upsert por keycloak_id · snapshot realm reconocido</text>
        <text x="222" y="384" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8">SUPERADMIN · RECTOR · DECANO · DIRECTOR</text>

        <!-- Local persistence path -->
        <rect x="72" y="418" width="300" height="56" rx="6" fill="#fff" stroke="#6c8589" stroke-width="1.1"/>
        <text x="222" y="440" text-anchor="middle" fill="#173d45" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600">Adaptadores · JPA / JDBC</text>
        <text x="222" y="458" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8.5">inbox + perfil + roles en una transacción local</text>

        <rect x="72" y="540" width="300" height="78" rx="6" fill="#dcefee" stroke="#168f9a" stroke-width="1.4"/>
        <ellipse cx="99" cy="562" rx="10" ry="4" fill="none" stroke="#168f9a" stroke-width="1.4"/>
        <path d="M89 562v15c0 2 4 4 10 4s10-2 10-4v-15M89 569c0 2 4 4 10 4s10-2 10-4" fill="none" stroke="#168f9a" stroke-width="1.4"/>
        <text x="222" y="565" text-anchor="middle" fill="#173d45" font-family="'Geist', sans-serif" font-size="12" font-weight="600">PostgreSQL IAM</text>
        <text x="222" y="584" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8.5">perfiles · roles · contextos · catálogos · inbox</text>
        <text x="222" y="602" text-anchor="middle" fill="#526e74" font-family="'Geist', sans-serif" font-size="8.5">separada del OLTP Jachasun</text>

        <!-- External catalog feed; it does not join the user-event path -->
        <rect x="428" y="434" width="152" height="42" rx="5" fill="#fff" stroke="#6c8589" stroke-width="1"/>
        <text x="504" y="452" text-anchor="middle" fill="#173d45" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600">Jachasun OLTP</text>
        <text x="504" y="467" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8">fuente académica</text>
        <line x1="504" y1="476" x2="504" y2="494" stroke="#526e74" stroke-width="1.1" marker-end="url(#arquitectura-seguridad-auth-service-sync-arrow)"/>
        <rect x="428" y="494" width="152" height="60" rx="5" fill="#fff" stroke="#187ea2" stroke-width="1.2"/>
        <text x="504" y="514" text-anchor="middle" fill="#173d45" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600">Apache Hop</text>
        <text x="504" y="531" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="7.5">SELECT · INSERT · UPDATE</text>
        <text x="504" y="545" text-anchor="middle" fill="#526e74" font-family="'Geist Mono', monospace" font-size="8">sin DELETE ni DDL</text>
      </svg>
