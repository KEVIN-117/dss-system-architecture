openapi: 3.1.0
info:
  title: DW Control Service API
  version: 1.0.0-draft
  description: >-
    Contrato documental para la administración de cierres académicos, la
    consulta de ejecuciones ETL y el Load Manager (LM-005): lanzar, detener y
    programar procesos ETL en Hop Server fuera del horario operativo de la DSA.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Academic closures
  - name: ETL executions
  - name: Load Manager
  - name: Load Manager schedules
paths:
  /academic-closures:
    get:
      tags: [Academic closures]
      operationId: listAcademicClosures
      summary: Lista cierres académicos
      x-required-permission: dw:closure:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: gestion
          in: query
          schema: { type: integer, minimum: 2000, maximum: 32767 }
        - name: periodo
          in: query
          schema: { type: integer, minimum: 1, maximum: 32767 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ClosureStatus' }
      responses:
        '200':
          description: Página de cierres.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClosurePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Academic closures]
      operationId: createAcademicClosure
      summary: Crea un cierre pendiente
      x-required-permission: dw:closure:manage
      description: Actor obtenido del subject del JWT; no se acepta actor en el body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClosureRequest' }
      responses:
        '201':
          description: Cierre creado en estado PENDIENTE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicClosure' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /academic-closures/{closureId}:
    parameters:
      - name: closureId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [Academic closures]
      operationId: getAcademicClosure
      summary: Obtiene un cierre académico
      x-required-permission: dw:closure:read
      responses:
        '200':
          description: Detalle del cierre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicClosure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /academic-closures/{closureId}/events:
    parameters:
      - name: closureId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
    get:
      tags: [Academic closures]
      operationId: listAcademicClosureEvents
      summary: Consulta la bitácora del cierre
      x-required-permission: dw:closure:read
      responses:
        '200':
          description: Eventos inmutables, del más reciente al más antiguo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClosureEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /academic-closures/{closureId}/close:
    post:
      tags: [Academic closures]
      operationId: closeAcademicPeriod
      summary: Autoriza el cierre de un periodo
      x-required-permission: dw:closure:manage
      parameters:
        - name: closureId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClosureCommand' }
      responses:
        '200':
          description: El cierre quedó en CERRADO.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicClosure' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /academic-closures/{closureId}/reopen:
    post:
      tags: [Academic closures]
      operationId: reopenAcademicPeriod
      summary: Reabre un periodo cerrado o procesado
      x-required-permission: dw:closure:manage
      parameters:
        - name: closureId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReopenClosureRequest' }
      responses:
        '200':
          description: El cierre quedó en REABIERTO.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicClosure' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /etl/executions:
    get:
      tags: [ETL executions]
      operationId: listEtlExecutions
      summary: Lista ejecuciones ETL registradas por Hop
      x-required-permission: dw:etl-monitor:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema:
            type: string
            enum: [SOLICITADA, EN_EJECUCION, PUBLICANDO, EXITOSA, FALLIDA, CANCELADA]
        - name: executionKind
          in: query
          schema:
            type: string
            enum: [HISTORICA, CIERRE_ACADEMICO, REPROCESO]
        - name: gestion
          in: query
          schema: { type: integer, minimum: 2000 }
        - name: periodo
          in: query
          schema: { type: integer, minimum: 1 }
        - name: closureId
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Página de ejecuciones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /etl/executions/{runId}:
    get:
      tags: [ETL executions]
      operationId: getEtlExecution
      summary: Consulta ejecución, pasos, métricas y errores saneados
      x-required-permission: dw:etl-monitor:read
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle de ejecución.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /etl/health:
    get:
      tags: [Load Manager]
      operationId: getLoadManagerHealth
      summary: Disponibilidad de Hop Server y estado del monitor y del scheduler
      x-required-permission: dw:etl-monitor:read
      responses:
        '200':
          description: Estado del Load Manager. hopOnline es false cuando Hop no responde.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadManagerHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /etl/status:
    get:
      tags: [Load Manager]
      operationId: getEtlStatus
      summary: Indica si hay algún ETL en curso (indicador del header del portal)
      x-required-permission: dw:etl-monitor:read
      responses:
        '200':
          description: Lanzamientos QUEUED, SUBMITTED o RUNNING.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtlStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /etl/processes:
    get:
      tags: [Load Manager]
      operationId: listEtlProcesses
      summary: Catálogo de procesos que el Load Manager puede ejecutar o programar
      x-required-permission: dw:etl-monitor:read
      responses:
        '200':
          description: Procesos del catálogo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EtlProcess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /etl/launches:
    get:
      tags: [Load Manager]
      operationId: listEtlLaunches
      summary: Historial de lanzamientos, del más reciente al más antiguo
      description: El historial de disparos de una programación es scheduleId=<id>.
      x-required-permission: dw:etl-monitor:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: processCode
          in: query
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EtlLaunchStatus' }
        - name: trigger
          in: query
          schema: { type: string, enum: [MANUAL, SCHEDULED] }
        - name: scheduleId
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Página de lanzamientos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtlLaunchPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Load Manager]
      operationId: launchEtlProcess
      summary: Registra un lanzamiento y lo envía a Hop Server
      description: >-
        Responde 201 con el lanzamiento. Puede quedar ya en SUBMIT_FAILED si Hop
        rechazó la solicitud. Responde 409 si el proceso ya tiene un lanzamiento
        activo y 503 si Hop Server no está disponible (el intento queda registrado).
      x-required-permission: dw:etl:execute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LaunchEtlRequest' }
      responses:
        '201':
          description: Lanzamiento registrado.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtlLaunch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/HopUnavailable' }
  /etl/launches/{launchId}:
    get:
      tags: [Load Manager]
      operationId: getEtlLaunch
      summary: Consulta un lanzamiento
      x-required-permission: dw:etl-monitor:read
      parameters:
        - $ref: '#/components/parameters/LaunchId'
      responses:
        '200':
          description: Lanzamiento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtlLaunch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /etl/launches/{launchId}/logs:
    get:
      tags: [Load Manager]
      operationId: getEtlLaunchLogs
      summary: Cola saneada del log de Hop (máximo 64 KiB)
      x-required-permission: dw:etl-monitor:read
      parameters:
        - $ref: '#/components/parameters/LaunchId'
      responses:
        '200':
          description: Log del lanzamiento, actualizado por el monitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtlLaunchLog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /etl/launches/{launchId}/stop:
    post:
      tags: [Load Manager]
      operationId: stopEtlLaunch
      summary: Pide detener un lanzamiento activo
      description: >-
        Responde 202. El lanzamiento pasa a STOPPED cuando el monitor lo observa en
        Hop. Uno que todavía estaba QUEUED se detiene de inmediato.
      x-required-permission: dw:etl:execute
      parameters:
        - $ref: '#/components/parameters/LaunchId'
      responses:
        '202':
          description: Detención solicitada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtlLaunch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/HopUnavailable' }
  /etl/schedules:
    get:
      tags: [Load Manager schedules]
      operationId: listEtlSchedules
      summary: Programaciones vigentes (no eliminadas)
      x-required-permission: dw:etl-monitor:read
      responses:
        '200':
          description: Programaciones ordenadas por nombre.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EtlSchedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Load Manager schedules]
      operationId: createEtlSchedule
      summary: Crea una programación fuera del horario operativo de la DSA
      description: >-
        Responde 400 con el motivo si el cron no tiene 6 campos, si la zona no
        es válida, si nunca se ejecuta, si alguna de sus próximas 20 ejecuciones
        cae en el horario operativo de la DSA o si dos ejecuciones seguidas están
        a menos de 1 h.
      x-required-permission: dw:etl-schedule:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEtlScheduleRequest' }
      responses:
        '201':
          description: Programación creada.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtlSchedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /etl/schedules/preview:
    get:
      tags: [Load Manager schedules]
      operationId: previewEtlSchedule
      summary: Próximas ejecuciones de una expresión cron y si sería aceptada
      x-required-permission: dw:etl-monitor:read
      parameters:
        - name: cronExpression
          in: query
          required: true
          schema: { type: string, maxLength: 120 }
        - name: timezone
          in: query
          schema: { type: string, maxLength: 64 }
        - name: count
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Vista previa. No guarda nada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /etl/schedules/{scheduleId}:
    get:
      tags: [Load Manager schedules]
      operationId: getEtlSchedule
      summary: Consulta una programación
      x-required-permission: dw:etl-monitor:read
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200':
          description: Programación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtlSchedule' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Load Manager schedules]
      operationId: updateEtlSchedule
      summary: Edita nombre, cron y zona; el proceso no cambia
      x-required-permission: dw:etl-schedule:manage
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEtlScheduleRequest' }
      responses:
        '200':
          description: Programación actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtlSchedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Load Manager schedules]
      operationId: deleteEtlSchedule
      summary: Borrado lógico; los lanzamientos conservan su programación
      x-required-permission: dw:etl-schedule:manage
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
        - name: rowVersion
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Programación eliminada.
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /etl/schedules/{scheduleId}/enable:
    post:
      tags: [Load Manager schedules]
      operationId: enableEtlSchedule
      summary: Reactiva una programación (se vuelve a validar contra el horario DSA)
      x-required-permission: dw:etl-schedule:manage
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleVersionRequest' }
      responses:
        '200':
          description: Programación activa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtlSchedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /etl/schedules/{scheduleId}/disable:
    post:
      tags: [Load Manager schedules]
      operationId: disableEtlSchedule
      summary: Pausa una programación
      x-required-permission: dw:etl-schedule:manage
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleVersionRequest' }
      responses:
        '200':
          description: Programación pausada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtlSchedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    LaunchId:
      name: launchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    BadRequest:
      description: Petición inválida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Token ausente, inválido o vencido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: El usuario no tiene el permiso requerido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso inexistente.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Duplicado o transición incompatible con el estado actual.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Error interno con detalle seguro.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Dependencia de base de datos temporalmente no disponible.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    HopUnavailable:
      description: Hop Server o la base de datos no están disponibles (code HOP_UNAVAILABLE o DEPENDENCY_UNAVAILABLE).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ClosureStatus:
      type: string
      enum: [PENDIENTE, CERRADO, REABIERTO, PROCESADO]
    AcademicClosure:
      type: object
      required: [closureId, gestion, periodo, status, version, createdBySubject, closureReason, createdAt, updatedAt]
      properties:
        closureId: { type: integer, format: int64 }
        gestion: { type: integer, minimum: 2000 }
        periodo: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/ClosureStatus' }
        effectiveAt: { type: [string, 'null'], format: date-time }
        authorizedBySubject: { type: [string, 'null'] }
        createdBySubject: { type: string }
        closureReason: { type: string }
        version: { type: integer, minimum: 1 }
        processedRunId: { type: [string, 'null'], format: uuid }
        processedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateClosureRequest:
      type: object
      additionalProperties: false
      required: [gestion, periodo, reason]
      properties:
        gestion: { type: integer, minimum: 2000, maximum: 32767 }
        periodo: { type: integer, minimum: 1, maximum: 32767 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ClosureCommand:
      type: object
      additionalProperties: false
      required: [effectiveAt, reason]
      properties:
        effectiveAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ReopenClosureRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ClosureEvent:
      type: object
      required: [eventId, closureId, toStatus, actorSubject, reason, occurredAt]
      properties:
        eventId: { type: integer, format: int64 }
        closureId: { type: integer, format: int64 }
        fromStatus: { type: [string, 'null'] }
        toStatus: { $ref: '#/components/schemas/ClosureStatus' }
        actorSubject: { type: string }
        reason: { type: string }
        runId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
    ClosurePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AcademicClosure' }
    ClosureEventPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ClosureEvent' }
    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ExecutionSummary:
      type: object
      required: [runId, executionKind, status, requestedBy, requestedAt]
      properties:
        runId: { type: string, format: uuid }
        executionKind: { type: string, enum: [HISTORICA, CIERRE_ACADEMICO, REPROCESO] }
        status: { type: string, enum: [SOLICITADA, EN_EJECUCION, PUBLICANDO, EXITOSA, FALLIDA, CANCELADA] }
        closureId: { type: [integer, 'null'], format: int64, description: Identificador del cierre académico relacionado cuando aplica. }
        requestedGestion: { type: [integer, 'null'] }
        requestedPeriodo: { type: [integer, 'null'] }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    ExecutionStep:
      type: object
      required: [stepCode, phase, status, stepOrder]
      properties:
        stepCode: { type: string }
        phase: { type: string, enum: [EXTRACCION, STAGING, TRANSFORMACION, VALIDACION, PUBLICACION] }
        status: { type: string, enum: [PENDIENTE, EN_EJECUCION, EXITOSO, FALLIDO, OMITIDO] }
        stepOrder: { type: integer }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    ExecutionMetric:
      type: object
      required: [name, value, unit, measuredAt]
      description: Solo campos operativos permitidos; no incluye dimensiones JSON ni datos de filas.
      properties:
        name: { type: string }
        value: { type: number }
        unit: { type: string }
        measuredAt: { type: string, format: date-time }
    SanitizedExecutionError:
      type: object
      required: [severity, code, message, occurredAt]
      description: El mensaje es genérico; causa original, texto bruto y details no se exponen.
      properties:
        severity: { type: string, enum: [INFO, WARN, ERROR, CRITICAL] }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_.-]{0,99}$' }
        message: { type: string, maxLength: 200 }
        stepCode: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    ExecutionDetail:
      allOf:
        - $ref: '#/components/schemas/ExecutionSummary'
        - type: object
          required: [steps, metrics, errors]
          properties:
            steps:
              type: array
              items: { $ref: '#/components/schemas/ExecutionStep' }
            metrics:
              type: array
              items: { $ref: '#/components/schemas/ExecutionMetric' }
            errors:
              type: array
              items: { $ref: '#/components/schemas/SanitizedExecutionError' }
    ExecutionPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ExecutionSummary' }
    LoadManagerHealth:
      type: object
      required: [hopOnline, monitoringEnabled, schedulerEnabled, operatingWindow, checkedAt]
      properties:
        hopOnline: { type: boolean }
        hopStatus: { type: [string, 'null'], description: Descripción de Hop (Online) o null si no responde. }
        monitoringEnabled: { type: boolean }
        schedulerEnabled: { type: boolean }
        operatingWindow: { type: string, description: Horario operativo de la DSA en texto. }
        checkedAt: { type: string, format: date-time }
    EtlProcess:
      type: object
      required: [code, displayName, workflowFile, parameterNames, schedulable, enabled]
      properties:
        code: { type: string, enum: [VERTICAL_LOAD, CATALOG_SYNC, PUBLISH_STAGED] }
        displayName: { type: string }
        description: { type: string }
        workflowFile: { type: string }
        parameterNames: { type: array, items: { type: string } }
        schedulable: { type: boolean }
        scheduleMode: { type: [string, 'null'], enum: [AUTO_PENDING_CLOSURES, NO_PARAMETERS, null] }
        enabled: { type: boolean }
    EtlLaunchStatus:
      type: string
      enum: [QUEUED, SUBMITTED, RUNNING, SUCCEEDED, FAILED, STOPPED, SKIPPED, SUBMIT_FAILED]
    EtlLaunch:
      type: object
      required: [id, processCode, trigger, parameters, status, active, requestedBy, requestedAt, rowVersion]
      properties:
        id: { type: string, format: uuid }
        processCode: { type: string }
        trigger: { type: string, enum: [MANUAL, SCHEDULED] }
        scheduleId: { type: [integer, 'null'], format: int64 }
        closureId: { type: [integer, 'null'], format: int64 }
        runId: { type: [string, 'null'], format: uuid, description: 'P_RUN_ID enviado a Hop; enlaza con /etl/executions/{runId}.' }
        parameters: { type: object, additionalProperties: { type: string } }
        status: { $ref: '#/components/schemas/EtlLaunchStatus' }
        active: { type: boolean }
        hopExecutionId: { type: [string, 'null'], format: uuid }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        stopRequestedBy: { type: [string, 'null'] }
        stopRequestedAt: { type: [string, 'null'], format: date-time }
        resultSummary: { type: [string, 'null'], description: Resultado o motivo (incluido el de una ejecución OMITIDA). }
        rowVersion: { type: integer }
    EtlLaunchPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/EtlLaunch' }
    EtlLaunchLog:
      type: object
      required: [launchId, status, active, log]
      properties:
        launchId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/EtlLaunchStatus' }
        active: { type: boolean }
        log: { type: string, description: Cola del log de Hop sin credenciales ni caracteres de control. }
    EtlStatus:
      type: object
      required: [running, active]
      properties:
        running: { type: boolean }
        active:
          type: array
          items: { $ref: '#/components/schemas/EtlLaunch' }
    LaunchEtlRequest:
      type: object
      required: [processCode]
      description: >-
        VERTICAL_LOAD requiere executionKind=CIERRE_ACADEMICO con closureId de un
        cierre CERRADO, o REPROCESO con retryOfRunId. PUBLISH_STAGED requiere
        runId. CATALOG_SYNC no requiere nada más.
      properties:
        processCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        executionKind: { type: string, enum: [CIERRE_ACADEMICO, REPROCESO] }
        closureId: { type: integer, format: int64, minimum: 1 }
        retryOfRunId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
    EtlSchedule:
      type: object
      required: [id, processCode, name, cronExpression, timezone, mode, enabled, firing, rowVersion]
      properties:
        id: { type: integer, format: int64 }
        processCode: { type: string }
        name: { type: string }
        cronExpression: { type: string, description: Cron de Spring de 6 campos (segundo minuto hora día mes día-semana). }
        timezone: { type: string }
        mode: { type: string, enum: [AUTO_PENDING_CLOSURES, NO_PARAMETERS] }
        enabled: { type: boolean }
        nextFireAt: { type: [string, 'null'], format: date-time }
        lastFiredAt: { type: [string, 'null'], format: date-time }
        lastLaunchId: { type: [string, 'null'], format: uuid }
        firing: { type: boolean, description: Una instancia la está disparando en este momento. }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer }
    CreateEtlScheduleRequest:
      type: object
      required: [processCode, name, cronExpression]
      properties:
        processCode: { type: string, enum: [VERTICAL_LOAD, CATALOG_SYNC] }
        name: { type: string, maxLength: 120 }
        cronExpression: { type: string, maxLength: 120, examples: ['0 0 2 * * *'] }
        timezone: { type: string, maxLength: 64, default: America/La_Paz }
        enabled: { type: boolean, default: true }
    UpdateEtlScheduleRequest:
      type: object
      required: [name, cronExpression, rowVersion]
      properties:
        name: { type: string, maxLength: 120 }
        cronExpression: { type: string, maxLength: 120 }
        timezone: { type: string, maxLength: 64 }
        rowVersion: { type: integer, minimum: 1 }
    ScheduleVersionRequest:
      type: object
      required: [rowVersion]
      properties:
        rowVersion: { type: integer, minimum: 1 }
    SchedulePreview:
      type: object
      required: [cronExpression, timezone, operatingWindow, valid, occurrences]
      properties:
        cronExpression: { type: string }
        timezone: { type: string }
        operatingWindow: { type: string }
        valid: { type: boolean }
        validationMessage: { type: [string, 'null'] }
        occurrences:
          type: array
          items:
            type: object
            required: [at, insideOperatingWindow]
            properties:
              at: { type: string, format: date-time }
              insideOperatingWindow: { type: boolean }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: Texto seguro sin datos internos sensibles. }
        instance: { type: string, format: uri-reference }
        code: { type: string, description: Código estable consumible por clientes. }
