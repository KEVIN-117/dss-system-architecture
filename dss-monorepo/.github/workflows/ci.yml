name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # These values are isolated test configuration. Production secrets are
    # never committed and must be supplied through the deployment environment.
    env:
      ADMIN_PORTAL_PORT: 3001
      DECANO_DASHBOARD_PORT: 3002
      DIRECTOR_DASHBOARD_PORT: 3003
      RECTOR_DASHBOARD_PORT: 3004
      BFF_PORT: 3006
      NEXT_PUBLIC_BFF_URL: http://localhost:3006
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: uatf-dss-realm
      KEYCLOAK_AUDIENCE: uatf-auth-service
      KEYCLOAK_ROLE_CLIENT_ID: uatf-auth-service
      KEYCLOAK_BFF_CLIENT_ID: dss-bff
      KEYCLOAK_BFF_CLIENT_SECRET: ci-client-secret-not-used-in-production
      KEYCLOAK_BFF_REDIRECT_URI: http://localhost:3006/api/auth/callback
      KEYCLOAK_BFF_POST_LOGOUT_REDIRECT_URI: http://localhost:3001/login
      AUTH_SERVICE_URL: http://localhost:8000
      BFF_ALLOWED_ORIGINS: http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
      BFF_DEFAULT_POST_LOGIN_REDIRECT_URI: http://localhost:3001/
      BFF_SESSION_SECRET: ci-session-secret-not-used-in-production-123456
      BFF_SESSION_TTL_SECONDS: 300
      BFF_SESSION_COOKIE: dss_session
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Configure Nx Agents and task distribution in .nx/ci-config.yaml
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#nx-cloud-start-nx-agents
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: bunx nx start-nx-agents

      - run: bun install --no-cache
      - run: bun playwright install --with-deps

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: bun nx record -- echo Hello World
      # When you enable task distribution, run the e2e-ci task instead of e2e
      - run: bun nx run-many -t lint test build typecheck e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: bun nx fix-ci
        if: always()
