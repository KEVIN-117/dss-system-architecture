services:
  # ==========================================
  # INFRAESTRUCTURA (Bases de Datos y Servicios de Terceros)
  # ==========================================
  auth-service-db:
    image: postgres:15-alpine
    container_name: auth-service-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${AUTH_DB_USER}
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD}
      - POSTGRES_DB=${AUTH_DB_NAME}
    restart: always
    volumes:
      - ./infra/auth-service-db:/var/lib/postgresql/data
      - ./infra/keycloak/init-db.sql:/docker-entrypoint-initdb.d/01-keycloak-schema.sql
    networks:
      - dss-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres-dw:
    #build: ./data-layer/postgres-dw
    image: postgres:15-alpine
    container_name: postgres-dw
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_DW_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DW_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DW_NAME}
    restart: always
    volumes:
      - ./infra/postgres-dw:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - dss-net

  dw-migrator:
    image: postgres:15-alpine
    depends_on:
      postgres-dw:
        condition: service_healthy
    environment:
      PGHOST: postgres-dw
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DW_NAME}
      PGUSER: ${POSTGRES_DW_USER}
      PGPASSWORD: ${POSTGRES_DW_PASSWORD}
    volumes:
      - ./infra/dw-schema/migrations:/migrations:ro
      - ./infra/dw-schema/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /scripts/apply-migrations.sh | /bin/sh"]
    restart: "no"
    networks:
      - dss-net

  # Reconcile the restricted runtime login after role migrations.
  dw-control-db-provision:
    image: ${DOCKERHUB_USERNAME:-local}/dss-dw-control-db-provision:${DW_CONTROL_DB_PROVISION_VERSION:-local}
    build:
      context: ./infra/dw-control-db-provision
      dockerfile: Dockerfile
    depends_on:
      dw-migrator:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres-dw
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DW_NAME}
      PGUSER: ${POSTGRES_DW_USER}
      PGPASSWORD: ${POSTGRES_DW_PASSWORD}
      DW_CONTROL_DB_PASSWORD: ${DW_CONTROL_DB_PASSWORD:?DW_CONTROL_DB_PASSWORD must be set in the root .env}
    restart: "no"
    networks:
      - dss-net

  dw-control-service:
    image: ${DOCKERHUB_USERNAME:-local}/dss-dw-control-service:${DW_CONTROL_IMAGE_TAG:-local}
    build:
      context: ./dw-control-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-dw:
        condition: service_healthy
      dw-migrator:
        condition: service_completed_successfully
      dw-control-db-provision:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      DW_CONTROL_PROFILE: ${DW_CONTROL_PROFILE:-dev}
      DW_CONTROL_PORT: "8090"
      DW_CONTROL_OPENAPI_ENABLED: ${DW_CONTROL_OPENAPI_ENABLED:-true}
      # Inside the Compose network, localhost points to this container. Always use the DW service DNS.
      DW_CONTROL_DB_URL: jdbc:postgresql://postgres-dw:5432/${POSTGRES_DW_NAME}
      DW_CONTROL_DB_USERNAME: ${DW_CONTROL_DB_USERNAME:-dw_control_runtime}
      DW_CONTROL_DB_PASSWORD: ${DW_CONTROL_DB_PASSWORD:?DW_CONTROL_DB_PASSWORD must be set in the root .env}
      DW_CONTROL_DB_POOL_SIZE: ${DW_CONTROL_DB_POOL_SIZE:-8}
      DW_CONTROL_DB_CONNECTION_TIMEOUT_MS: ${DW_CONTROL_DB_CONNECTION_TIMEOUT_MS:-5000}
      KEYCLOAK_ISSUER_URI: ${AUTH_KEYCLOAK_ISSUER_URI:-http://localhost:8080/realms/uatf-dss-realm}
      KEYCLOAK_JWK_SET_URI: ${AUTH_KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/uatf-dss-realm/protocol/openid-connect/certs}
      KEYCLOAK_DW_CONTROL_AUDIENCE: ${KEYCLOAK_DW_CONTROL_AUDIENCE:-dw-control-service}
      KEYCLOAK_PERMISSIONS_CLIENT_ID: ${KEYCLOAK_PERMISSIONS_CLIENT_ID:-dss-permissions}
      # Load Manager (LM-003): Hop Server is the only execution engine; same credentials as hop-server.
      DW_CONTROL_HOP_SERVER_URL: http://hop-server:8080
      HOP_SERVER_USER: ${HOP_SERVER_USER:-dw-control}
      HOP_SERVER_PASS: ${HOP_SERVER_PASS:-}
    ports:
      - "127.0.0.1:${DW_CONTROL_PORT:-8090}:8090"
    networks:
      - dss-net

  keycloak:
    image: ${DOCKERHUB_USERNAME:-local}/dss-keycloak:${KEYCLOAK_VERSION:-local}
    build:
      context: ./infra/keycloak
      dockerfile: Dockerfile
    container_name: uatf-keycloak
    # Override para desarrollo local:
    command: >
      start-dev
      --import-realm
      --db=postgres
      --db-url=jdbc:postgresql://auth-service-db:5432/dss_identity
      --db-schema=keycloak
      --db-username=${KC_DB_USERNAME}
      --db-password=${KC_DB_PASSWORD}
      --hostname-strict=false
      --proxy-headers=xforwarded
      --http-enabled=true
      --health-enabled=true
      --metrics-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET:?KEYCLOAK_BFF_CLIENT_SECRET must be set}
      KEYCLOAK_OLAP_CLIENT_SECRET: ${KEYCLOAK_OLAP_CLIENT_SECRET:?KEYCLOAK_OLAP_CLIENT_SECRET must be set}
      KEYCLOAK_AUTH_SERVICE_CLIENT_SECRET: ${KEYCLOAK_AUTH_SERVICE_CLIENT_SECRET:?KEYCLOAK_AUTH_SERVICE_CLIENT_SECRET must be set}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:8080:8080"   # Solo loopback, nunca 0.0.0.0
      - "127.0.0.1:9000:9000"   # Health/metrics (interno)
      - "127.0.0.1:3006:3006"   # BFF: comparte la red de este contenedor (ver servicio bff)
    depends_on:
      auth-service-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dss-net
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:9000/health/ready | grep -q '\"status\"[[:space:]]*:[[:space:]]*\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:5672:5672" # AMQP local development only
      - "127.0.0.1:15672:15672" # Web UI local development only
    volumes:
      - ./infra/rabbitmq/data:/var/lib/rabbitmq
    networks:
      - dss-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  hop-web:
    image: ${DOCKERHUB_USERNAME:-local}/dss-apache-hop:${APACHE_HOP_VERSION:-local}
    build:
      context: ./etl-layer/apache-hop
      dockerfile: Dockerfile
    container_name: dss-hop-web
    depends_on:
      dw-migrator:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HOP_WEB_PORT:-8081}:8080"
    volumes:
      - ./etl-layer/apache-hop/projects/dss-uatf-etl:/files/project:rw
      - ./etl-layer/apache-hop/scripts:/files/scripts:ro
    entrypoint: ["/bin/bash", "/files/scripts/start-hop-web.sh"]
    command: []
    environment:
      HOP_PROJECT_NAME: dss-uatf-etl
      HOP_PROJECT_FOLDER: /files/project
      HOP_ENVIRONMENT_NAME: ${HOP_ENVIRONMENT_NAME:-dev}
      HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS: /files/project/environments/${HOP_ENVIRONMENT_NAME:-dev}-env.json
      HOP_ADDITIONAL_ENVIRONMENT_NAMES: ${HOP_ADDITIONAL_ENVIRONMENT_NAMES-dev,test}
      HOP_SHARED_JDBC_FOLDERS: /usr/local/tomcat/jdbc-drivers
      HOP_OPTIONS: >-
        -DDB_DW_HOST=${DB_DW_HOST:-host.docker.internal}
        -DDB_DW_PORT=${DB_DW_PORT:-5434}
        -DDB_DW_NAME=${POSTGRES_DW_NAME}
        -DDB_TX_HOST=${DB_TX_HOST:-host.docker.internal}
        -DDB_TX_PORT=${DB_TX_PORT:-5432}
        -DDB_TX_NAME=${POSTGRES_TX_NAME}
    networks:
      - dss-net
  # Load Manager execution engine (LM-001). Not published on the host:
  # only dw-control-service calls its API over dss-net.
  hop-server:
    image: ${DOCKERHUB_USERNAME:-local}/dss-apache-hop-server:${APACHE_HOP_VERSION:-local}
    build:
      context: ./etl-layer/apache-hop
      dockerfile: Dockerfile.server
    container_name: dss-hop-server
    restart: unless-stopped
    depends_on:
      dw-migrator:
        condition: service_completed_successfully
    expose:
      - "8080"
    volumes:
      # Read-only: the server executes what Hop Web saves in the project.
      - ./etl-layer/apache-hop/projects/dss-uatf-etl:/files/project:ro
    environment:
      HOP_ENVIRONMENT_NAME: ${HOP_ENVIRONMENT_NAME:-dev}
      HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS: /files/project/environments/${HOP_ENVIRONMENT_NAME:-dev}-env.json
      HOP_SERVER_USER: ${HOP_SERVER_USER:-dw-control}
      # Empty on purpose when unset: start-hop-server.sh stops this container
      # with a clear error instead of breaking the whole stack.
      HOP_SERVER_PASS: ${HOP_SERVER_PASS:-}
      HOP_OPTIONS: >-
        -DDB_DW_HOST=${DB_DW_HOST:-host.docker.internal}
        -DDB_DW_PORT=${DB_DW_PORT:-5434}
        -DDB_DW_NAME=${POSTGRES_DW_NAME}
        -DDB_TX_HOST=${DB_TX_HOST:-host.docker.internal}
        -DDB_TX_PORT=${DB_TX_PORT:-5432}
        -DDB_TX_NAME=${POSTGRES_TX_NAME}
    networks:
      - dss-net
  # ==========================================
  # MICROSERVICIOS PROPIOS
  # ==========================================
  auth-service:
    image: ${DOCKERHUB_USERNAME:-local}/dss-auth-service:${AUTH_SERVICE_VERSION:-local}
    build: ./auth-service
    depends_on:
      auth-service-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    environment:
      - SPRING_PROFILE_ACTIVE=${AUTH_SPRING_PROFILE_ACTIVE}
      - SERVER_PORT=${AUTH_SERVER_PORT}
      - DB_URI=${AUTH_DB_URI}
      - DB_USERNAME=${AUTH_DB_USER}
      - DB_PASSWORD=${AUTH_DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${AUTH_KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${AUTH_KEYCLOAK_JWK_SET_URI}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
      - KEYCLOAK_RESOURCE_ID=${AUTH_KEYCLOAK_RESOURCE_ID}
      - KEYCLOAK_AUDIENCE=${AUTH_KEYCLOAK_AUDIENCE:-${AUTH_KEYCLOAK_RESOURCE_ID}}
      - KEYCLOAK_PRINCIPAL_ATTRIBUTE=${AUTH_KEYCLOAK_PRINCIPAL_ATTRIBUTE}
      # Keycloak Admin REST API (IAM-003): service account of uatf-auth-service.
      - KEYCLOAK_ADMIN_BASE_URL=${AUTH_KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080}
      - KEYCLOAK_ADMIN_REALM=${AUTH_KEYCLOAK_ADMIN_REALM:-uatf-dss-realm}
      - KEYCLOAK_AUTH_SERVICE_CLIENT_ID=${AUTH_KEYCLOAK_AUTH_SERVICE_CLIENT_ID:-uatf-auth-service}
      - KEYCLOAK_AUTH_SERVICE_CLIENT_SECRET=${KEYCLOAK_AUTH_SERVICE_CLIENT_SECRET:?KEYCLOAK_AUTH_SERVICE_CLIENT_SECRET must be set}
      - AUTH_CORS_ALLOWED_ORIGINS=${AUTH_CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005}
    ports:
      - "8000:${AUTH_SERVER_PORT}"
    networks:
      - dss-net

  olap-service:
    image: ${DOCKERHUB_USERNAME:-local}/dss-olap-service:${OLAP_SERVICE_VERSION:-local}
    build:
      context: ./olap-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-dw:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      olap-home-init:
        condition: service_completed_successfully
    environment:
      SAIKU_HOME: /app/saiku-home
      # This deployment is an empty OLAP API; demo fixtures are intentionally disabled.
      SAIKU_DEMO: "false"
      # Local development only: BFF analytics return aggregates, with k=5 cell suppression.
      SAIKU_AI_POLICY: aggregated
      SAIKU_AI_KANONYMITY: "5"
      # Keep the default-admin guard enabled; provide a strong value in the ignored local .env.
      SAIKU_ADMIN_PASSWORD: ${SAIKU_ADMIN_PASSWORD:-}
      KEYCLOAK_ISSUER_URI: ${AUTH_KEYCLOAK_ISSUER_URI:-http://localhost:8080/realms/uatf-dss-realm}
      KEYCLOAK_JWK_SET_URI: ${AUTH_KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/uatf-dss-realm/protocol/openid-connect/certs}
      KEYCLOAK_OLAP_AUDIENCE: ${OLAP_KEYCLOAK_AUDIENCE:-olap-service}
      KEYCLOAK_PERMISSIONS_CLIENT_ID: ${KEYCLOAK_PERMISSIONS_CLIENT_ID:-dss-permissions}
    ports:
      - "127.0.0.1:${OLAP_PORT:-8088}:8080"
    volumes:
      # Start with a clean repository. The previous olap_home volume is left intact as a backup.
      - olap_home_empty:/app/saiku-home
    networks:
      - dss-net

  # Installs the approved academic catalog into the persistent Saiku home.
  # Runtime DB credentials come from the ignored root .env and are written
  # only to the private datasource properties file inside the named volume.
  olap-home-init:
    image: ${DOCKERHUB_USERNAME:-local}/dss-olap-home-init:${OLAP_HOME_INIT_VERSION:-local}
    build:
      context: ./infra/olap
      dockerfile: Dockerfile
    restart: "no"
    environment:
      OLAP_DB_USER: ${OLAP_DB_USER:-dw_olap_runtime}
      OLAP_DB_PASSWORD: ${OLAP_DB_PASSWORD:-}
      OLAP_DB_NAME: ${POSTGRES_DW_NAME:-}
      OLAP_DB_HOST: ${POSTGRES_DW_HOST:-postgres-dw}
      OLAP_DB_PORT: "5432"
    volumes:
      - olap_home_empty:/app/saiku-home
    networks:
      - dss-net

  prediction-service:
    image: ghcr.io/kevin-117/prediction-service-api:${PREDICTION_IMAGE_TAG:-local}
    build:
      context: ./prediction-service
      dockerfile: Dockerfile
    restart: on-failure
    # The API listens on 8000 inside dss-net (the dockerized BFF uses prediction-service:8000) and is
    # published on host loopback 18007 for the host-run BFF and local tools. The DW and workers stay private.
    ports:
      - "127.0.0.1:${PREDICTION_HOST_PORT:-18007}:8000"
    environment:
      PREDICTION_ENV: ${PREDICTION_ENV:-development}
      PREDICTION_HOST: 0.0.0.0
      PREDICTION_PORT: 8000
      PREDICTION_LOG_LEVEL: ${PREDICTION_LOG_LEVEL:-info}
      PREDICTION_RELOAD: ${PREDICTION_RELOAD:-false}
      PREDICTION_DATABASE_URL: ${PREDICTION_API_DATABASE_URL:-${PREDICTION_DATABASE_URL:-postgresql://${POSTGRES_DW_USER}:${POSTGRES_DW_PASSWORD}@postgres-dw:5432/${POSTGRES_DW_NAME}}}
      PREDICTION_DW_DATABASE_URL: ${PREDICTION_DW_DATABASE_URL:-}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      KEYCLOAK_PERMISSIONS_CLIENT_ID: ${KEYCLOAK_PERMISSIONS_CLIENT_ID:-dss-permissions}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-${AUTH_KEYCLOAK_ISSUER_URI:-}}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-${AUTH_KEYCLOAK_JWK_SET_URI:-}}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      PREDICTION_IDEMPOTENCY_SCOPE: ${PREDICTION_IDEMPOTENCY_SCOPE:-development}
      # Training admission control: running + queued jobs never exceed these.
      WORKER_MAX_CONCURRENT_JOBS: ${WORKER_MAX_CONCURRENT_JOBS:-1}
      PREDICTION_MAX_QUEUED_JOBS: ${PREDICTION_MAX_QUEUED_JOBS:-4}
      PREDICTION_OUTBOX_POLL_SECONDS: ${PREDICTION_OUTBOX_POLL_SECONDS:-5}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${PREDICTION_RABBITMQ_USER:-${RABBITMQ_DEFAULT_USER}}
      RABBITMQ_PASSWORD: ${PREDICTION_RABBITMQ_PASSWORD:-${RABBITMQ_DEFAULT_PASS}}
      RABBITMQ_VHOST: ${PREDICTION_RABBITMQ_VHOST:-${RABBITMQ_VHOST:-/}}
      WORKER_ARTIFACTS_DIR: /app/artifacts
      PREDICTION_DATASET_ROOT: ${PREDICTION_DATASET_ROOT:-/app/snapshots}
      PREDICTION_CUSTOM_DATASET_ROOT: /app/custom-datasets
      PREDICTION_EXTRACTED_DATASET_ROOT: /app/extracted-datasets
    volumes:
      - prediction_artifacts:/app/artifacts
      # Uploaded datasets: written by the API, read-only for the worker.
      - prediction_custom_datasets:/app/custom-datasets
      # DW extractions (PRED-102): written by the worker, read-only for the API.
      - prediction_extracted_datasets:/app/extracted-datasets:ro
    depends_on:
      postgres-dw:
        condition: service_healthy
      dw-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - dss-net

  prediction-worker:
    image: ghcr.io/kevin-117/prediction-service-worker:${PREDICTION_IMAGE_TAG:-local}
    build:
      context: ./prediction-service
      dockerfile: Dockerfile.worker
    restart: on-failure
    # Training only: long jobs must not block population publication.
    command: ["celery", "-A", "training.tasks.celery_app", "worker", "--loglevel=info", "-c", "1",
              "-Q", "prediction.train_model", "--without-mingle", "--without-gossip", "--without-heartbeat"]
    environment:
      PREDICTION_ENV: ${PREDICTION_ENV:-development}
      PREDICTION_DATABASE_URL: ${PREDICTION_WORKER_DATABASE_URL:-${PREDICTION_DATABASE_URL:-postgresql://${POSTGRES_DW_USER}:${POSTGRES_DW_PASSWORD}@postgres-dw:5432/${POSTGRES_DW_NAME}}}
      PREDICTION_DW_DATABASE_URL: ${PREDICTION_DW_DATABASE_URL:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${PREDICTION_RABBITMQ_USER:-${RABBITMQ_DEFAULT_USER}}
      RABBITMQ_PASSWORD: ${PREDICTION_RABBITMQ_PASSWORD:-${RABBITMQ_DEFAULT_PASS}}
      RABBITMQ_VHOST: ${PREDICTION_RABBITMQ_VHOST:-${RABBITMQ_VHOST:-/}}
      WORKER_MAX_CONCURRENT_JOBS: ${WORKER_MAX_CONCURRENT_JOBS:-1}
      WORKER_MAX_JOB_ATTEMPTS: ${WORKER_MAX_JOB_ATTEMPTS:-3}
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-1800}
      WORKER_CPU_LIMIT: ${WORKER_CPU_LIMIT:-2}
      WORKER_MEMORY_LIMIT_MB: ${WORKER_MEMORY_LIMIT_MB:-2048}
      WORKER_ARTIFACTS_DIR: /app/artifacts
      PREDICTION_DATASET_ROOT: ${PREDICTION_DATASET_ROOT:-/app/snapshots}
      PREDICTION_CONFIG_ROOT: /app/configurations
      PREDICTION_CUSTOM_DATASET_ROOT: /app/custom-datasets
      PREDICTION_EXTRACTED_DATASET_ROOT: /app/extracted-datasets
    volumes:
      - prediction_artifacts:/app/artifacts
      - prediction_custom_datasets:/app/custom-datasets:ro
      - prediction_extracted_datasets:/app/extracted-datasets
      - ${PREDICTION_SNAPSHOT_DIR:-./infra/prediction-snapshots}:/app/snapshots:ro
      - ${PREDICTION_CONFIG_DIR:-./infra/prediction-configurations}:/app/configurations:ro
    cpus: ${WORKER_CPU_LIMIT:-2}
    mem_limit: ${WORKER_MEMORY_LIMIT_MB:-2048}m
    depends_on:
      postgres-dw:
        condition: service_healthy
      dw-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - dss-net

  prediction-publisher:
    # Same worker image, dedicated to population scoring/publication so it is
    # never queued behind a long training job. Artifacts are read-only here.
    image: ghcr.io/kevin-117/prediction-service-worker:${PREDICTION_IMAGE_TAG:-local}
    build:
      context: ./prediction-service
      dockerfile: Dockerfile.worker
    restart: on-failure
    command: ["celery", "-A", "training.tasks.celery_app", "worker", "--loglevel=info", "-c", "1",
              "-Q", "prediction.publish_population", "--without-mingle", "--without-gossip", "--without-heartbeat"]
    environment:
      PREDICTION_ENV: ${PREDICTION_ENV:-development}
      PREDICTION_DATABASE_URL: ${PREDICTION_WORKER_DATABASE_URL:-${PREDICTION_DATABASE_URL:-postgresql://${POSTGRES_DW_USER}:${POSTGRES_DW_PASSWORD}@postgres-dw:5432/${POSTGRES_DW_NAME}}}
      PREDICTION_DW_DATABASE_URL: ${PREDICTION_DW_DATABASE_URL:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${PREDICTION_RABBITMQ_USER:-${RABBITMQ_DEFAULT_USER}}
      RABBITMQ_PASSWORD: ${PREDICTION_RABBITMQ_PASSWORD:-${RABBITMQ_DEFAULT_PASS}}
      RABBITMQ_VHOST: ${PREDICTION_RABBITMQ_VHOST:-${RABBITMQ_VHOST:-/}}
      WORKER_MAX_CONCURRENT_JOBS: "1"
      WORKER_MAX_JOB_ATTEMPTS: ${WORKER_MAX_JOB_ATTEMPTS:-3}
      WORKER_JOB_TIMEOUT_SECONDS: ${PREDICTION_PUBLISH_TIMEOUT_SECONDS:-1800}
      WORKER_ARTIFACTS_DIR: /app/artifacts
    volumes:
      - prediction_artifacts:/app/artifacts:ro
    cpus: ${PREDICTION_PUBLISHER_CPU_LIMIT:-1}
    mem_limit: ${PREDICTION_PUBLISHER_MEMORY_LIMIT_MB:-1024}m
    depends_on:
      postgres-dw:
        condition: service_healthy
      dw-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - dss-net

  # etl-service:
  #   build: ./etl-service
  #   networks:
  #     - dss-net

  # ==========================================
  # BFF Y FRONTENDS (Next.js, imagen dss-monorepo/Dockerfile)
  # ==========================================
  # Todas las apps se sirven en localhost con los mismos puertos que en
  # desarrollo; las URL NEXT_PUBLIC_* se fijan al construir la imagen porque
  # el navegador las usa directamente.
  #
  # El BFF comparte la red del contenedor de Keycloak (network_mode). Así
  # http://localhost:8080 es Keycloak tanto para el navegador como para el BFF
  # (autorización, intercambio de tokens y JWKS), y los tokens salen con el
  # emisor http://localhost:8080 que validan auth-service, olap-service y
  # prediction-service. Por eso el puerto 3006 se publica en keycloak. Si se
  # recrea keycloak, hay que recrear también el BFF.
  bff:
    image: ${DOCKERHUB_USERNAME:-local}/dss-bff:${FRONTEND_IMAGE_TAG:-local}
    build: &next-app-build
      context: ./dss-monorepo
      dockerfile: Dockerfile
      args:
        APP_NAME: bff
        NEXT_PUBLIC_BFF_URL: http://localhost:3006
        NEXT_PUBLIC_LANDING_URL: http://localhost:3000
        NEXT_PUBLIC_ADMIN_PORTAL_URL: http://localhost:3001
        NEXT_PUBLIC_DECANO_DASHBOARD_URL: http://localhost:3002
        NEXT_PUBLIC_DIRECTOR_DASHBOARD_URL: http://localhost:3003
        NEXT_PUBLIC_RECTOR_DASHBOARD_URL: http://localhost:3004
    network_mode: "service:keycloak"
    environment:
      PORT: 3006
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-uatf-dss-realm}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-uatf-auth-service}
      # IAM-014: optional realm roles that open a portal, e.g. {"VICERRECTOR":"RECTOR"}.
      KEYCLOAK_PORTAL_ROLES: ${KEYCLOAK_PORTAL_ROLES:-}
      KEYCLOAK_BFF_CLIENT_ID: dss-bff
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET:?KEYCLOAK_BFF_CLIENT_SECRET must be set}
      KEYCLOAK_BFF_REDIRECT_URI: http://localhost:3006/api/auth/callback
      KEYCLOAK_BFF_POST_LOGOUT_REDIRECT_URI: http://localhost:3000/login
      AUTH_SERVICE_URL: http://auth-service:${AUTH_SERVER_PORT:-8000}
      DW_CONTROL_SERVICE_URL: http://dw-control-service:8090
      OLAP_SERVICE_URL: http://olap-service:8080
      # Saiku admin gate (IAM-012): same permissions catalog as olap-service.
      KEYCLOAK_PERMISSIONS_CLIENT_ID: ${KEYCLOAK_PERMISSIONS_CLIENT_ID:-dss-permissions}
      OLAP_ACADEMIC_SCOPE_FILTERS: '{"faculty":{"dimension":"Ámbito de facultad","hierarchy":"Facultad","level":"Facultad","memberTemplate":"[Ámbito de facultad].[Facultad].[Facultad].&[{id}]"},"career":{"dimension":"Ámbito de carrera","hierarchy":"Carrera","level":"Carrera","memberTemplate":"[Ámbito de carrera].[Carrera].[Carrera].&[{id}]"}}'
      PREDICTION_SERVICE_URL: http://prediction-service:8000
      BFF_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
      BFF_DEFAULT_POST_LOGIN_REDIRECT_URI: http://localhost:3000/auth/callback
      BFF_SESSION_SECRET: ${BFF_SESSION_SECRET:?BFF_SESSION_SECRET must be set (32+ characters)}
    depends_on:
      keycloak:
        condition: service_healthy
      auth-service:
        condition: service_started
      dw-control-service:
        condition: service_started
      olap-service:
        condition: service_started
      prediction-service:
        condition: service_started
    restart: unless-stopped

  landing:
    image: ${DOCKERHUB_USERNAME:-local}/dss-landing:${FRONTEND_IMAGE_TAG:-local}
    build:
      <<: *next-app-build
      args: &next-public-urls
        APP_NAME: landing
        NEXT_PUBLIC_BFF_URL: http://localhost:3006
        NEXT_PUBLIC_LANDING_URL: http://localhost:3000
        NEXT_PUBLIC_ADMIN_PORTAL_URL: http://localhost:3001
        NEXT_PUBLIC_DECANO_DASHBOARD_URL: http://localhost:3002
        NEXT_PUBLIC_DIRECTOR_DASHBOARD_URL: http://localhost:3003
        NEXT_PUBLIC_RECTOR_DASHBOARD_URL: http://localhost:3004
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [bff]
    networks: [dss-net]
    restart: unless-stopped

  admin-portal:
    image: ${DOCKERHUB_USERNAME:-local}/dss-admin-portal:${FRONTEND_IMAGE_TAG:-local}
    build:
      <<: *next-app-build
      args:
        <<: *next-public-urls
        APP_NAME: admin-portal
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [bff]
    networks: [dss-net]
    restart: unless-stopped

  decano-dashboard:
    image: ${DOCKERHUB_USERNAME:-local}/dss-decano-dashboard:${FRONTEND_IMAGE_TAG:-local}
    build:
      <<: *next-app-build
      args:
        <<: *next-public-urls
        APP_NAME: decano-dashboard
    ports:
      - "127.0.0.1:3002:3000"
    depends_on: [bff]
    networks: [dss-net]
    restart: unless-stopped

  director-dashboard:
    image: ${DOCKERHUB_USERNAME:-local}/dss-director-dashboard:${FRONTEND_IMAGE_TAG:-local}
    build:
      <<: *next-app-build
      args:
        <<: *next-public-urls
        APP_NAME: director-dashboard
    ports:
      - "127.0.0.1:3003:3000"
    depends_on: [bff]
    networks: [dss-net]
    restart: unless-stopped

  rector-dashboard:
    image: ${DOCKERHUB_USERNAME:-local}/dss-rector-dashboard:${FRONTEND_IMAGE_TAG:-local}
    build:
      <<: *next-app-build
      args:
        <<: *next-public-urls
        APP_NAME: rector-dashboard
    ports:
      - "127.0.0.1:3004:3000"
    depends_on: [bff]
    networks: [dss-net]
    restart: unless-stopped

networks:
  dss-net:
    driver: bridge

volumes:
  postgres_data:
  olap_home_empty:
  prediction_artifacts:
  prediction_custom_datasets:
  prediction_extracted_datasets:
