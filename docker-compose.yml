services:
  # ==========================================
  # INFRAESTRUCTURA (Bases de Datos y Servicios de Terceros)
  # ==========================================
  auth-service-db:
    image: postgres:15-alpine
    container_name: auth-service-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${AUTH_DB_USER}
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD}
      - POSTGRES_DB=${AUTH_DB_NAME}
    restart: always
    volumes:
      - ./infra/auth-service-db:/var/lib/postgresql/data
      - ./infra/keycloak/init-db.sql:/docker-entrypoint-initdb.d/01-keycloak-schema.sql
    networks:
      - dss-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres-dw:
    #build: ./data-layer/postgres-dw
    image: postgres:15-alpine
    container_name: postgres-dw
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_DW_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DW_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DW_NAME}
    restart: always
    volumes:
      - ./infra/postgres-dw:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - dss-net

  dw-migrator:
    image: postgres:15-alpine
    depends_on:
      postgres-dw:
        condition: service_healthy
    environment:
      PGHOST: postgres-dw
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DW_NAME}
      PGUSER: ${POSTGRES_DW_USER}
      PGPASSWORD: ${POSTGRES_DW_PASSWORD}
    volumes:
      - ./infra/dw-schema/migrations:/migrations:ro
      - ./infra/dw-schema/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /scripts/apply-migrations.sh | /bin/sh"]
    restart: "no"
    networks:
      - dss-net

  neo4j:
    build: ./data-layer/neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - dss-net

  keycloak:
    build:
      context: ./infra/keycloak
      dockerfile: Dockerfile
    container_name: uatf-keycloak
    # Override para desarrollo local:
    command: >
      start-dev
      --import-realm
      --db=postgres
      --db-url=jdbc:postgresql://auth-service-db:5432/dss_identity
      --db-schema=keycloak
      --db-username=${KC_DB_USERNAME}
      --db-password=${KC_DB_PASSWORD}
      --hostname-strict=false
      --proxy-headers=xforwarded
      --http-enabled=true
      --health-enabled=true
      --metrics-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KEYCLOAK_WEBHOOK_URL: ${KEYCLOAK_WEBHOOK_URL}
      KEYCLOAK_WEBHOOK_SECRET: ${KEYCLOAK_WEBHOOK_SECRET}
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET:?KEYCLOAK_BFF_CLIENT_SECRET must be set}
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import
      #- ./infra/keycloak/providers:/opt/keycloak/providers
    ports:
      - "127.0.0.1:8080:8080"   # Solo loopback, nunca 0.0.0.0
      - "127.0.0.1:9000:9000"   # Health/metrics (interno)
    depends_on:
      auth-service-db:
        condition: service_healthy
    networks:
      - dss-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Web UI
    volumes:
      - ./infra/rabbitmq/data:/var/lib/rabbitmq
    networks:
      - dss-net
  hop-web:
    image: apache/hop-web:${HOP_WEB_VERSION:-2.19.0}
    container_name: dss-hop-web
    depends_on:
      dw-migrator:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HOP_WEB_PORT:-8081}:8080"
    volumes:
      - ./etl-layer/apache-hop/projects/dss-uatf-etl:/files/project:rw
      - ./etl-layer/apache-hop/jdbc:/files/jdbc:ro
      - ./etl-layer/apache-hop/scripts:/files/scripts:ro
    entrypoint: ["/bin/bash", "/files/scripts/start-hop-web.sh"]
    command: []
    environment:
      HOP_PROJECT_NAME: dss-uatf-etl
      HOP_PROJECT_FOLDER: /files/project
      HOP_ENVIRONMENT_NAME: ${HOP_ENVIRONMENT_NAME:-dev}
      HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS: /files/project/environments/${HOP_ENVIRONMENT_NAME:-dev}-env.json
      HOP_SHARED_JDBC_FOLDERS: /files/jdbc
      HOP_OPTIONS: >-
        -DDB_DW_HOST=${DB_DW_HOST:-host.docker.internal}
        -DDB_DW_PORT=${DB_DW_PORT:-5434}
        -DDB_DW_NAME=${POSTGRES_DW_NAME}
        -DDB_TX_HOST=${DB_TX_HOST:-host.docker.internal}
        -DDB_TX_PORT=${DB_TX_PORT:-5432}
        -DDB_TX_NAME=${POSTGRES_TX_NAME}
    networks:
      - dss-net
  # ==========================================
  # MICROSERVICIOS PROPIOS
  # ==========================================
  auth-service:
    build: ./auth-service
    depends_on:
      - auth-service-db
    restart: on-failure
    environment:
      - SPRING_PROFILE_ACTIVE=${AUTH_SPRING_PROFILE_ACTIVE}
      - SERVER_PORT=${AUTH_SERVER_PORT}
      - DB_URI=${AUTH_DB_URI}
      - DB_USERNAME=${AUTH_DB_USER}
      - DB_PASSWORD=${AUTH_DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${AUTH_KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${AUTH_KEYCLOAK_JWK_SET_URI}
      - KEYCLOAK_WEBHOOK_SECRET=${KEYCLOAK_WEBHOOK_SECRET}
      - KEYCLOAK_RESOURCE_ID=${AUTH_KEYCLOAK_RESOURCE_ID}
      - KEYCLOAK_AUDIENCE=${AUTH_KEYCLOAK_AUDIENCE:-${AUTH_KEYCLOAK_RESOURCE_ID}}
      - KEYCLOAK_PRINCIPAL_ATTRIBUTE=${AUTH_KEYCLOAK_PRINCIPAL_ATTRIBUTE}
      - AUTH_CORS_ALLOWED_ORIGINS=${AUTH_CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005}
    ports:
      - "8000:${AUTH_SERVER_PORT}"
    networks:
      - dss-net

  olap-service:
    build: ./olap-service
    networks:
      - dss-net

  prediction-service:
    build: ./prediction-service
    networks:
      - dss-net

  etl-service:
    build: ./etl-service
    networks:
      - dss-net

  # ==========================================
  # GATEWAY, BFF Y FRONTEND
  # ==========================================
  graphql-bff:
    build: ./gateway/graphql-bff
    depends_on:
      - auth-service
      - olap-service
      - prediction-service
      - etl-service
    networks:
      - dss-net

  gateway:
    build: ./gateway/traefik
    ports:
      - "80:80"
      - "443:443"
    networks:
      - dss-net

  frontend:
    build: ./frontend/nextjs-spa
    ports:
      - "3000:3000"
    networks:
      - dss-net

networks:
  dss-net:
    driver: bridge

volumes:
  postgres_data:
